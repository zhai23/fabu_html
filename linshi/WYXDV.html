    function show() {
        ensureDom();
        if (!panel) return;
        isOpenFlag = true;
        panel.style.display = 'flex';
        tag.style.display = 'none';
        switchTab(currentTab);
        updateCounts();
        startFps();
    }

    function hide() {
        if (!panel) return;
        isOpenFlag = false;
        panel.style.display = 'none';
        tag.style.display = 'block';
        stopFps();
    }

    function toggle() { isOpenFlag ? hide() : show(); }

    function setEnabled(v) {
        _enabled = !!v;
        console.log('[BrowserLogViewer] setEnabled(' + _enabled + ')');
        if (!_enabled) hide();
    }

    function clearLog() {
        ring = new Array(MAX_ENTRIES);
        ringHead = 0;
        ringCount = 0;
        selectedLog = null;
        if (bodyList) bodyList.innerHTML = '';
        if (stackView) stackView.style.display = 'none';
        updateCounts();
    }

    // ===== 手势开关:右上角连点 2 次 =====
    var downX = -1, downY = -1, downTime = 0, downOk = false;
    var lastUpTime = -1e9;
    var tapSeq = 0;

    function inHotzone(x, y) {
        var w = window.innerWidth || document.documentElement.clientWidth || 0;
        var h = window.innerHeight || document.documentElement.clientHeight || 0;
        return x >= w * (1 - HOTZONE_W) &amp;&amp; y &lt;= h * HOTZONE_H;
    }

    function getPos(e) {
        if (e &amp;&amp; e.clientX !== undefined) {
            return { x: e.clientX, y: e.clientY, t: (typeof e.timeStamp === 'number') ? e.timeStamp : Date.now() };
        }
        var p = (e &amp;&amp; (e.touches || e.changedTouches) &amp;&amp; (e.touches || e.changedTouches)[0]) || null;
        if (!p) return null;
        return { x: p.clientX, y: p.clientY, t: (typeof e.timeStamp === 'number') ? e.timeStamp : Date.now() };
    }

    function onDown(pos) {
        if (!_enabled || !pos) return;
        downX = pos.x;
        downY = pos.y;
        downTime = pos.t;
        downOk = inHotzone(downX, downY);
        var hitEl = document.elementFromPoint(downX, downY);
        if (panel &amp;&amp; hitEl &amp;&amp; panel.contains(hitEl)) downOk = false;
        if (isOpenFlag) downOk = false;
        if (downOk) {
            if (downTime - lastUpTime > TAP_INTERVAL_MS) tapSeq = 0;
        } else {
            tapSeq = 0;
        }
    }

    function onUp(pos) {
        if (!_enabled || !pos) return;
        var dx = pos.x - downX;
        var dy = pos.y - downY;
        if (downOk &amp;&amp; (dx * dx + dy * dy) &lt;= TAP_MOVE_PX * TAP_MOVE_PX) {
            tapSeq++;
            if (tapSeq >= TAP_COUNT) {
                tapSeq = 0;
                toggle();
            }
        } else {
            tapSeq = 0;
        }
        lastUpTime = pos.t;
        downOk = false;
    }

    if (typeof window.PointerEvent !== 'undefined') {
        document.addEventListener('pointerdown', function (e) { onDown(getPos(e)); }, true);
        document.addEventListener('pointerup', function (e) { onUp(getPos(e)); }, true);
    } else {
        document.addEventListener('touchstart', function (e) { onDown(getPos(e)); }, true);
        document.addEventListener('touchend', function (e) { onUp(getPos(e)); }, true);
    }

    // ===== 对外 API =====
    window.BrowserLogViewer = {
        show: show,
        hide: hide,
        toggle: toggle,
        clear: clearLog,
        setEnabled: setEnabled,
        // 供游戏上报引擎内部阶段(场景加载等),mark(&quot;场景加载完成&quot;)
        mark: function (name) {
            if (!name) return;
            bootStages.push({ name: String(name), at: performance.now() });
            if (isOpenFlag &amp;&amp; currentTab === 'boot') renderBootView();
        },
        // 供游戏上报业务负载规模,load({enemy:127, meat:30})
        //
        // 【为什么必须有这个】
        //   报告能说出「QuadTree#Insert 调用 96 万次」,但说不出那是
        //   「30 个对象 × 每帧重建树」还是「对象数失控」—— 两者修法完全相反。
        //   缺的就是分母。这个口子把分母补上。
        load: function (obj) {
            if (!obj) return;
            var now = performance.now();
            try {
                for (var k in obj) {
                    if (!Object.prototype.hasOwnProperty.call(obj, k)) continue;
                    var v = obj[k];
                    if (typeof v !== 'number' || !isFinite(v)) continue;
                    var g = loadStats[k];
                    if (!g) { g = loadStats[k] = { name: k, sum: 0, n: 0, max: 0, last: 0 }; }
                    g.sum += v; g.n++; g.last = v;
                    if (v > g.max) g.max = v;
                }
                loadLastAt = now;
            } catch (e) { /* 忽略 */ }
        },
        // 函数级剖析档位: 'off' | 'count' | 'white' | 'all',切档立即生效
        setFnLevel: function (v) {
            v = String(v || '').toLowerCase();
            fnLevel = (v === 'off') ? FN_OFF : (v === 'count') ? FN_COUNT : (v === 'all') ? FN_ALL : FN_WHITE;
            if (isOpenFlag &amp;&amp; currentTab === 'fn') renderFnView();
            return fnLevelName();
        },
        // 钩子自检:确认 Bridge.define 真的被包上了(真机上一行就能验)
        fnStatus: function () {
            return {
                bridgeHooked: fnBridgeHooked, definePatched: fnDefinePatched,
                level: fnLevelName(), types: fnTypes, methods: fnMethods,
                recorded: fnList().length, engineMarks: engineMarks.length
            };
        },
        // 纯文本启动报告(手机上可复制/回传)
        report: bootReport,
        // 帧阶段/DrawCall 归因的状态与数据(真机自检 + 二次分析用)
        perfStatus: function () {
            return {
                frameHooked: fpHooked, physicsHooked: fpPhysHooked,
                frames: fpTotalFrames, programs: dcList().length,
                drawCallSource: drawCallSource
            };
        },
        frameStats: function () {
            return {
                cur: { frame: fpCur.frame, update: fpCur.update, render: fpCur.render, other: fpCur.other, physics: fpPhysCur },
                sec: { frame: fpSec.frame, update: fpSec.update, render: fpSec.render, other: fpSec.other, physics: fpPhysSec, n: fpSec.n },
                peak: { frame: fpPeak.frame, update: fpPeak.update, render: fpPeak.render }
            };
        },
        // 能力自检:哪些数据在这台设备/这个浏览器上真的能拿到
        capabilities: function () {
            var secure = true;
            try { secure = (window.isSecureContext !== false); } catch (e) { secure = true; }
            return {
                longtask: ltSupport, longtaskFired: ltFired,
                memory: heapMB() > 0, secureContext: secure,
                frameHooked: fpHooked, physicsHooked: fpPhysHooked,
                fnProfiler: fnDefinePatched, engineMarks: engineMarks.length,
                gpuTiming: false,
                ua: (navigator &amp;&amp; navigator.userAgent) ? navigator.userAgent : ''
            };
        },
        drawCalls: function () { return dcList(); },
        // 卡顿数据(真机自检 / 二次分析)
        hitches: function () { return hitchList(); },
        hitchStats: function () {
            return {
                threshold: hitchMs, total: fpTotalFrames,
                count: hitchCount1, severe: hitchCount2, worst: hitchWorst,
                dropRate: fpTotalFrames > 0 ? (hitchCount1 / fpTotalFrames * 100) : 0,
                shaderRuntime: { count: shaderRuntimeCount, ms: shaderRuntimeMs },
                gc: gcEvents.length, allocPerFrame: allocPerFrame,
                memAvailable: heapMB() > 0
            };
        },
        setHitchMs: function (v) {
            v = Number(v);
            if (v > 0) hitchMs = v;
            if (isOpenFlag &amp;&amp; currentTab === 'hitch') renderHitchView();
            return hitchMs;
        },
        setDcSort: function (v) {
            dcSort = (v === 'tris' || v === 'name') ? v : 'calls';
            if (isOpenFlag &amp;&amp; currentTab === 'perf') renderDcTable();
            return dcSort;
        },
        // 原始数据,便于自己二次分析
        data: function () {
            return { stages: computeStages().stages, engineMarks: engineMarks, bootStages: bootStages, fn: fnList() };
        },
        // --- 自动化测试注入口(真机上不用管;留着是为了下钻逻辑能被回归测试覆盖) ---
        _debugPushTask: function (start, dur) { bootTasks.push({ start: start, dur: dur }); },
        _debugPushShader: function (kind, ms, at) {
            shaderEvents.push({ kind: kind, ms: ms, at: at });
            shaderEvents.sort(function (a, b) { return b.ms - a.ms; });
        },
        _debugOpenStage: function (name) {
            stageOpen[name] = !stageOpen[name];
            renderBootView();
        },
        // 重放外部引用桥(BlvBridge.js)在插件注入前积压的 mark 请求(含原始时间戳)
        _replayPending: function () {
            var q = window.__blvPending;
            if (q &amp;&amp; q.length) {
                bootStages = bootStages.concat(q);
                bootStages.sort(function (a, b) { return a.at - b.at; });
                window.__blvPending = [];
                if (isOpenFlag &amp;&amp; currentTab === 'boot') renderBootView();
            }
        }
    };

    // ===== 启动(注入到 &lt;head> 最前,早于引擎脚本 → 全量日志) =====
    // 绕过 Luna 平台构建的日志抑制:
    // 引擎包装 console 时,devToolsAreOpen=false(DevTools 关闭/手机)则只计数不输出,
    // 每 50ms 强制置 true → 引擎判断时恒为 true → 走原生通道 → 本插件可采集全量日志
    if (typeof setInterval === 'function') {
        setInterval(function () { window.devToolsAreOpen = true; }, 50);
    }
    hookConsole();
    hookErrors();
    hookNetworkFailures();
    hookNetworks();
    hookLongTasks();
    hookWebGLDraw();
    // 让引擎把材质/Shader 真名写到 GL program 上(否则 DrawCall 归因只能显示&quot;程序 #N&quot;)。
    // 必须早于引擎首次渲染,故放在这里。
    enableProgramNames();
    // 引擎实测启动锚点(luna:* 事件) —— 必须早于引擎脚本注册,故放在这里
    hookEngineMarks();
    // 帧阶段/物理计时:引擎此刻多半还没就绪,挂到 luna:started 后再试,
    // 面板打开时每帧还会重试一次(见 fpsTick),两条路都挂上就自动停。
    window.addEventListener('luna:started', function () {
        hookFramePhases();
        hookPhysics();
        // 启动结束:此后的 shader 编译算&quot;运行期&quot;,要单独报警
        markBootDone(performance.now());
        // luna:started 是引擎把所有 lunaStartup.timestamps 写完的时刻,立刻补一次锚点。
        // ?startup 参数下引擎的官方报告在这里生成,mergeLunaStartup 可以拿到所有事件。
        mergeLunaStartup();
    });
    // 函数级剖析:拦住 window.Bridge 赋值,在任何 Bridge.define 执行前包好方法表
    fnLevelFromQuery();
    hookBridgeDefine();
    // 回放外部引用桥积压的 mark 请求(此时插件 API 已就绪)
    try { window.BrowserLogViewer._replayPending(); } catch (e) { /* 忽略 */ }
    console.log('[BrowserLogViewer] loaded, PointerEvent=' + (typeof window.PointerEvent !== 'undefined'));
    // ===== 默认常驻显示(面板贴右上角,页面就绪即可见) =====
    // 不带参数            -> 直接显示,停在默认页签(logs)
    // blv=boot/perf/sys/logs/fn/hitch -> 显示并切到该页签
    // blvdelay=毫秒       -> 面板照常立刻显示,只把切页签推迟(等游戏跑起来,数据更全)
    // blv=off             -> 不自动显示,退回右上角连点呼出
    function autoOpenFromQuery() {
        try {
            var q = String(location.search || '');
            var m = q.match(/[?&amp;]blv=([a-z]+)/i);
            var want = m ? m[1].toLowerCase() : '';
            if (want === 'off') { hide(); return; }
            show();
            if (!want) return;
            if (want !== 'boot' &amp;&amp; want !== 'perf' &amp;&amp; want !== 'sys' &amp;&amp; want !== 'logs' &amp;&amp; want !== 'fn' &amp;&amp; want !== 'hitch') want = 'boot';
            var dm = q.match(/[?&amp;]blvdelay=(\d+)/i);
            var delay = dm ? parseInt(dm[1], 10) : 0;
            var doTab = function () { currentTab = want; if (isOpenFlag) switchTab(want); };
            if (delay > 0) setTimeout(doTab, delay);
            else doTab();
        } catch (e) { /* 忽略 */ }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { ensureDom(); autoOpenFromQuery(); });
    } else {
        ensureDom();
        autoOpenFromQuery();
    }
})();

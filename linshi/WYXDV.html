    <style>
        * { border: none; margin: 0; padding: 0; width: 100%; height: 100%; position: relative; }

        #banner {
            font-family: 'Poppins', sans-serif;
            position: absolute;
            height: 30px;
            background: #914AFA;
            color: whitesmoke;
            text-align: center;
            opacity: 1;
            transition: opacity 500ms;
            z-index: 1;
            max-width: 250px;
            border-radius: 8px;
            left: 0;
            right: 0;
            top: 10px;
            margin-left: auto;
            margin-right: auto;
            line-height: 30px;
        }

        #banner.hidden {
           opacity: 0;
        }

        #iframe {
            z-index: 0;
        }
    </style>
    <script>
        let TEXTURE_ID_START = 1e6;
        let FONT_DTO_TEXTURE_ID_INDEX = 6;
        let bannerTimeout;

        // Listen all the messages across the window to catch important events such Luna CTA Button clicked, etc.
        window.addEventListener( 'message', onMessage, false );

        // message structure is next: { target: "editor", title: "CTA Button Clicked", type: "success" }
        function onMessage( event ) {
            const data = event.data;

            // for 'CTA Button Clicked' event type always will be 'success'
            // and there're no other events with this type
            if ( data.type === 'success' ) {
                showBanner( data.title );
            }
        }

        function showBanner( title ) {
            const bannerElement = document.getElementById( 'banner' );
            bannerElement.classList.remove( 'hidden' );
            bannerElement.innerHTML = title;

            clearTimeout( bannerTimeout );
            bannerTimeout = setTimeout( function() {
                bannerElement.classList.add( 'hidden' );
            }, 2000);
        }

        function iframeLoaded() {
            var iframe = document.getElementById("iframe");
            var preloader = "{}";
            var filters = "{}";
            var postprocesses = "{\"ssao\":{\"isActive\":[\"boolean\",0],\"samplingQuality\":[\"enum\",1],\"normalsQuality\":[\"enum\",0],\"blurQuality\":[\"enum\",0],\"radius\":[\"float\",0.1],\"intensity\":[\"float\",1],\"falloff\":[\"float\",100]}}";
            var bundles = JSON.parse("{}");
            var overrides = "{\"PALib.LunaManager\":{\"jumpType\":[\"enum\",1],\"editorChannel\":[\"enum\",0]}}";
            var assets = "{}";

            var promises = [];

            Object.keys( bundles ).forEach( id => {
                promises.push(fetch(bundles[id]).then( response => response.json() ).then( json => {
                    if ( json.data && json.data[ FONT_DTO_TEXTURE_ID_INDEX ] === TEXTURE_ID_START + parseInt( json.id ) ) {
                        json.data[ FONT_DTO_TEXTURE_ID_INDEX ] = TEXTURE_ID_START + parseInt( id );
                    }

                    bundles[id] = { ...json, id };
                } ) );
            } );

            Promise.all(promises).then(function() {
                iframe.contentWindow.postMessage( JSON.stringify( { name: 'setPlaygroundPreloaderOverrides',    data: preloader } ), '*' );
                iframe.contentWindow.postMessage( JSON.stringify( { name: 'setPlaygroundFiltersOverrides',      data: filters } ), '*' );
                iframe.contentWindow.postMessage( JSON.stringify( { name: 'setPostProcessesOverrides',          data: postprocesses } ), '*' );
                iframe.contentWindow.postMessage( JSON.stringify( { name: 'setPlaygroundOverrides',             data: overrides } ), '*' );
                iframe.contentWindow.postMessage( JSON.stringify( { name: 'setPlaygroundBundleOverrides',       data: JSON.stringify(bundles) } ), '*' );
                iframe.contentWindow.postMessage( JSON.stringify( { name: 'setPlaygroundAssetOverrides',        data: assets } ), '*' );
            });
        }
    </script>
</head>

    <div id="banner" class="hidden"></div>
    <iframe id="iframe" onload="iframeLoaded()" srcdoc="&lt;!DOCTYPE html>&lt;html>&lt;head>

&lt;script>/*BLV_INJECTED*/
// ============================================================================
// BrowserLogViewer.js — 真机日志查看器(注入版)
// 由 start_logviewer.ps1 内联注入到 html 的 &lt;head> 最前,早于一切引擎脚本,
// 因此能采集全量日志(引擎启动 / Unity Debug.Log / JS 插件 / 运行时错误 / 网络失败),
// 与 DevTools Console 的日志内容一致。
// 默认启用,无需任何 C# 桥接。
// 界面:
//   三个页签: 日志 | 性能 | 系统
//   日志页签: 搜索 / 折叠 / 日志-警告-错误 过滤开关(仅在日志页签显示) + 列表 + 底部堆栈
//   性能页签: 内部三个子页签 网络 | FPS | 内存
//     网络: hook XHR/fetch(全浏览器可靠) 请求列表 + 汇总 + 启动基准
//     FPS: min/avg/max + 帧耗时 + long task + 启动30s峰值 + 稳态中位值 + 柱状图
//     内存: JS 堆实时 used/total/limit + 曲线(仅 Chromium;Safari 标 N/A)
//   系统页签: 浏览器/内核识别 + 系统信息 + WebGL 信息(静态)
// 显示:默认常驻,面板贴屏幕右上角,88vw x 65vh(缩小版),页面就绪即可见。
//      收起后可连点右上角 2 次重新呼出(测试模式,热区 60% 宽 x 50% 高);
//      URL 带 ?blv=off 则启动时不显示,退回纯手势呼出。
// 对外 API: window.BrowserLogViewer.show() / hide() / toggle() / clear() / setEnabled()
// ============================================================================
(function () {
    'use strict';
    if (window.BrowserLogViewer &amp;&amp; window.BrowserLogViewer.setEnabled) return;

    // ===== 运行时开关(注入版默认启用;setEnabled 可动态关闭) =====
    var _enabled = true;

    // ===== 配置 =====
    var MAX_ENTRIES = 2000;       // 环形缓冲条数(面板打开时回放早期日志)
    var MAX_RENDER = 500;         // 日志列表最大渲染条数(从最新截取,防 DOM 卡顿)
    var NET_MAX = 300;            // 网络资源列表最大条数
    var TAP_COUNT = 2;            // 连点次数(测试模式:2 次)
    var TAP_INTERVAL_MS = 300;    // 相邻 tap 的 up->down 最大间隔
    var TAP_MOVE_PX = 30;         // tap 允许的最大位移
    var HOTZONE_W = 0.60;         // 热区:屏幕宽 * 此比例(右上角,测试模式放大)
    var HOTZONE_H = 0.50;         // 热区:屏幕高 * 此比例(右上角)
    var SAMPLE_MAX = 60;          // 性能/内存采样点数(60 个 1s 点)
    var STARTUP_PEAK_MS = 30000;  // 启动期峰值统计窗口(前 30s)

    var LEVEL_COLOR = {
        log: '#c8c8c8',
        info: '#ffffff',
        debug: '#9aa4b1',
        warn: '#ffd54f',
        error: '#ff6b6b'
    };

    // ===== 日志采集(环形缓冲,原样记录不加工) =====
    var ring = new Array(MAX_ENTRIES);
    var ringHead = 0;
    var ringCount = 0;

    // ===== 日志显示过滤状态 =====
    var showLog = true;
    var showWarning = true;
    var showError = true;
    var collapse = false;
    var filterText = '';
    var selectedLog = null;       // 选中的日志条目(底部堆栈区)

    // ===== 网络资源(hook XHR/fetch) =====
    var netEntries = [];          // {name,method,size,duration,status,failed}
    var netBytesTotal = 0;        // 累计下载字节
    var bootTime = performance.now();   // 注入时点(启动基准)

    // ===== 启动耗时(页面加载→首帧渲染) / DrawCall =====
    var bootDrawTime = 0;         // 首次 WebGL draw 时刻(首帧)
    var drawCallCount = 0;        // WebGL draw 自计数累计(帧差用,兜底通道)
    var frameStartDrawCount = 0;  // 本帧开始时的计数(帧增量=本帧 drawcall)
    var drawCallsCur = 0;         // DrawCall/帧 实时值(每帧更新)
    var drawCallSamples = [];     // 60s 采样
    var drawCallSource = '探测中…';

    // ===== FPS / long task / 内存采样 =====
    var fpsRunning = false;
    var fpsCur = 0, fpsAvg = 0, fpsMin = 0, fpsMax = 0;
    var fpsMedian = 0;
    var fpsSamples = [];
    var fpsFrameCount = 0, fpsTimeStart = 0;
    var longTaskCount = 0, lastLongTaskMs = 0;
    var longTaskMsInSec = 0;      // 本秒 longtask 累计时长(阻塞率用)
    var blockRate = 0;            // 主线程阻塞率%(每秒结算,不进参数格,仅说明区显示)
    var memSamples = [];          // JS 堆 used,单位 MB
    var startupPeakFpsMin = 999, startupPeakMemMax = 0;

    // ===== 启动分析:阻塞时间轴 / Shader 编译 / 自定义阶段 =====
    var BOOT_WINDOW_MS = 30000;   // 启动阻塞时间轴窗口(真机冷启动常超 10s,窗口太小会把要查的阶段整段切掉)
    var BOOT_TASK_MAX = 600;      // 时间轴最多记录的 longtask 条数
    var bootTasks = [];           // {start,dur} 启动窗口内的 longtask
    var shaderCompileCount = 0;   // compileShader 调用次数
    var shaderCompileMs = 0;      // compileShader 累计同步耗时
    var shaderLinkCount = 0;      // linkProgram 调用次数
    var shaderLinkMs = 0;         // linkProgram 累计同步耗时
    var shaderStallMs = 0;        // 首次读取编译/链接状态的阻塞耗时(异步驱动真开销)
    var shaderEvents = [];        // {kind,ms,at} 最慢的若干条
    var shaderFirstAt = 0, shaderLastAt = 0;
    var bootStages = [];          // 外部接口上报: {name,at}

    // ===== 引擎启动事件(Luna 自己派发的实测锚点,场景加载等黑盒阶段全在这) =====
    // 引擎在 script1.js / index.html 里派发这些事件,时刻即 performance.now(),
    // 不需要 ?startup 参数,release 包同样有。C# Awake 之前的阶段只能靠它们切分。
    var LUNA_EVENTS = [
        ['luna:build', 'HTML 引导完成'],
        ['luna:start', '引擎 start'],
        ['luna:starting', '引擎 starting'],
        ['luna:startup:bundlesLoad', '资源包反序列化'],
        ['luna:startup:loadSimpleAssetsAsync', '贴图/Shader/网格/音频/动画'],
        ['luna:startup:shaderReady', 'Shader postLink 就绪'],
        ['luna:startup:loadComplexAssetsAsync', 'Cubemap/材质/精灵/字体/Animator'],
        ['luna:startup:loadPrefabsAsync', '预制体加载'],
        ['luna:startup:loadScenesAsync', '场景加载'],
        ['luna:started', '引擎 started'],
        ['luna:ready', '引擎 ready']
    ];
    var engineMarks = [];         // {ev,label,at} 引擎实测锚点
    var stageOpen = {};           // 启动阶段行展开状态(资源明细下钻)

    // ===== 函数级剖析(包裹 Bridge.define 的方法表) =====
    // Luna 转译产物形如 Bridge.define(&quot;PALib.LunaManager&quot;,{methods:{Awake:function(){...}}}),
    // release 包剥掉了 develop 包里的 TRACE 钩子但保留真实函数名,
    // 因此改为在 Bridge 挂上 window 的那一刻劫持 define,给方法表套探针。
    // 档位: 0=关 1=只计次 2=白名单计时(游戏脚本) 3=全量计时
    var FN_OFF = 0, FN_COUNT = 1, FN_WHITE = 2, FN_ALL = 3;
    var fnLevel = FN_WHITE;
    var fnStats = {};             // name -> {name,user,n,incl,self,max,first,last}
    var fnStack = [];             // 调用栈上各层的子调用累计耗时(算 self 用)
    var fnTypes = 0, fnMethods = 0;

            var t0 = performance.now();
            if (st.first === 0) { st.first = t0; markFnFirst(st); }
            st.last = t0;
            st.frameCalls++;
            fnStack.push(0);
            try {
                return fn.apply(this, arguments);
            } finally {
                var dt = performance.now() - t0;
                var child = fnStack.pop();
                if (fnStack.length) fnStack[fnStack.length - 1] += dt;
                st.incl += dt;
                st.self += (dt - child);
                st.frameIncl += dt;
                st.frameSelf += (dt - child);
                if (dt > st.max) st.max = dt;
            }
        };
    }

    function wrapTable(prefix, table) {
        if (!table) return;
        for (var k in table) {
            if (!Object.prototype.hasOwnProperty.call(table, k)) continue;
            var fn = table[k];
            if (typeof fn !== 'function') continue;
            table[k] = makeProbe(fnStat(prefix + k), fn);
            fnMethods++;
        }
    }

    // 只包 methods / statics.methods:ctors 与 props 访问器由 Bridge 内部按引用二次加工,
    // 包裹会改变其行为(且 get 访问器过热,计时反而失真)。
    function makeDefineWrapper(orig) {
        return function (name, cfg) {
            if (typeof name === 'string' &amp;&amp; cfg &amp;&amp; typeof cfg === 'object') {
                fnTypes++;
                wrapTable(name + '#', cfg.methods);
                if (cfg.statics) wrapTable(name + '#static#', cfg.statics.methods);
            }
            return orig.apply(this, arguments);
        };
    }

    // 给 Bridge 装上 define 探针。
    //
    // 【关键时序】release 包里 Bridge 对象**被赋值给 window 的那一刻还没有 define**:
    //     e.Bridge = t                        ← 此处 t 有 78 个键,不含 define
    //     ...(约 16KB 之后)...
    //     Bridge.define = Bridge.Class.define ← define 在这里才挂上
    // 所以只在 setter 里检查一次 `typeof bridge.define === 'function'` 必然扑空。
    // 正确做法是**再拦一层 define 属性本身**,等引擎把真身挂上来的瞬间包住它。
    function patchDefine(bridge) {
        if (!bridge || fnDefinePatched) return;
        if (typeof bridge.define === 'function') {
            bridge.define = makeDefineWrapper(bridge.define);
            fnDefinePatched = true;
            return;
        }
        // define 尚未出现 → 用访问器等它。引擎写 `Bridge.define = Bridge.Class.define` 时触发。
        try {
            var held;
            Object.defineProperty(bridge, 'define', {
                configurable: true,
                enumerable: true,
                get: function () { return held; },
                set: function (v) {
                    if (typeof v === 'function' &amp;&amp; !fnDefinePatched) {
                        held = makeDefineWrapper(v);
                        fnDefinePatched = true;
                    } else {
                        held = v;
                    }
                }
            });
        } catch (e) { /* 宿主禁止改属性:放弃函数剖析,其余功能不受影响 */ }
    }

    // release 包里 Bridge 通过 `(function(e){ ... e.Bridge = t ... }(this))` 挂到全局
    // (顶层 this === window),且 479 个 Bridge.define 调用与赋值在同一脚本内同步执行 ——
    // 轮询必然太晚,只能用访问器拦住赋值那一刻。本插件在 &lt;head>,引擎脚本在 &lt;body> defer,故一定更早。
    //
    // 赋值后立即把访问器换回普通属性(自擦除):访问器留在 window.Bridge 这种热点全局上
    // 会给后续每次读取都加一层函数调用,而且 index.html 里有 `&quot;Bridge&quot; in window` 判断,
    // 留着访问器等于永久改变 window 的形状。擦除后除了 define 被包过,与原状无差别。
    function hookBridgeDefine() {
        if (fnBridgeHooked) return;
        fnBridgeHooked = true;
        if (window.Bridge) { patchDefine(window.Bridge); return; }
        try {
            Object.defineProperty(window, 'Bridge', {
                configurable: true,
                enumerable: true,
                get: function () { return undefined; },
                set: function (v) {
                    delete window.Bridge;
                    window.Bridge = v;      // 恢复成普通可写属性,与引擎原本的赋值等效
                    patchDefine(v);
                }
            });
        } catch (e) {
            fnBridgeHooked = false;         // defineProperty 被禁 → 明确置回,面板会显示&quot;钩子未挂上&quot;
        }
    }

    function fnList() {
        var out = [];
        for (var k in fnStats) {
            if (!Object.prototype.hasOwnProperty.call(fnStats, k)) continue;

        }
        out.sort(function (a, b) {
            if (fnSort === 'n') return b.n - a.n;
            if (fnSort === 'incl') return b.incl - a.incl;
            if (fnSort === 'first') return a.first - b.first;
            return b.self - a.self;
        });
        return out;
    }

    // ===== 日志过滤 / 折叠 / 渲染 =====
    function passFilter(e) {
        if (e.level === 'warn' &amp;&amp; !showWarning) return false;
        if (e.level === 'error' &amp;&amp; !showError) return false;
        if (e.level !== 'warn' &amp;&amp; e.level !== 'error' &amp;&amp; !showLog) return false;
        if (filterText) {
            var ft = filterText.toLowerCase();
            if ((e.text + ' ' + e.stack).toLowerCase().indexOf(ft) &lt; 0) return false;
        }
        return true;
    }

    function ringAt(i) {
        return ring[(ringHead - ringCount + i + MAX_ENTRIES) % MAX_ENTRIES];
    }

    function computeVisible() {
        var list = [];
        if (collapse) {
            var map = {};
            var order = [];
            for (var i = 0; i &lt; ringCount; i++) {
                var e = ringAt(i);
                if (!passFilter(e)) continue;
                var key = e.level + '\u0001' + e.text;
                var hit = map[key];
                if (hit) { hit.count++; }
                else { hit = { entry: e, count: 1 }; map[key] = hit; order.push(hit); }
            }
            return order;
        }
        for (var j = 0; j &lt; ringCount; j++) {
            var en = ringAt(j);
            if (passFilter(en)) list.push({ entry: en, count: 1 });
        }
        return list;
    }

    function renderRow(item, idx) {
        var e = item.entry;
        var div = makeEl('div', {
            padding: '2px 6px',

            cursor: 'pointer',

                : (idx % 2 === 0 ? 'rgba(255,255,255,0.03)' : 'transparent')
        });
        var text = '[' + e.time + '] ' + e.text;
        if (item.count > 1) text += '  (x' + item.count + ')';
        div.textContent = text;
        div.addEventListener('click', function () {
            selectedLog = (selectedLog === e) ? null : e;
            renderLogs();
        });
        return div;
    }

    function renderLogs() {
        if (!bodyList) return;
        bodyList.innerHTML = '';
        var list = computeVisible();
        var from = Math.max(0, list.length - MAX_RENDER);
        for (var i = from; i &lt; list.length; i++) {
            bodyList.appendChild(renderRow(list[i], i));
        }
        renderStack();
        updateCounts();
    }

    function renderStack() {
        if (!stackView) return;
        if (!selectedLog) { stackView.style.display = 'none'; return; }
        stackView.style.display = 'block';
        var s = selectedLog.stack || '';
        stackText.textContent = s
            ? ('[' + selectedLog.time + '] [' + selectedLog.level + ']\n' + selectedLog.text + '\n--- 堆栈 ---\n' + s)
            : ('[' + selectedLog.time + '] [' + selectedLog.level + ']\n' + selectedLog.text + '\n(无堆栈信息)');
    }

    function appendEntry(entry) {
        if (!bodyList) return;
        var nearBottom = bodyList.scrollHeight - bodyList.scrollTop - bodyList.clientHeight &lt; 40;
        bodyList.appendChild(renderRow({ entry: entry, count: 1 }, bodyList.childNodes.length));
        while (bodyList.childNodes.length > MAX_RENDER) {
            bodyList.removeChild(bodyList.firstChild);
        }
        if (nearBottom) bodyList.scrollTop = bodyList.scrollHeight;
    }

    function updateCounts() {
        var cLog = 0, cWarn = 0, cErr = 0;
        for (var i = 0; i &lt; ringCount; i++) {
            var e = ringAt(i);
            if (e.level === 'warn') cWarn++;
            else if (e.level === 'error') cErr++;
            else cLog++;
        }
        if (btnLog) btnLog.textContent = '日志 ' + cLog;
        if (btnWarn) btnWarn.textContent = '警告 ' + cWarn;
        if (btnErr) btnErr.textContent = '错误 ' + cErr;
    }

    // ===== FPS / 长任务 / 内存 采样 =====
    function startFps() {
        if (fpsRunning) return;
        fpsRunning = true;
        fpsFrameCount = 0;
        fpsTimeStart = performance.now();
        requestAnimationFrame(fpsTick);
    }

    function stopFps() { fpsRunning = false; }

    function median(arr) {
        if (!arr.length) return 0;
        var a = arr.slice().sort(function (x, y) { return x - y; });
        var mid = Math.floor(a.length / 2);
        return a.length % 2 ? a[mid] : Math.round((a[mid - 1] + a[mid]) / 2);
    }

    function fpsTick(ts) {
        if (!fpsRunning) return;
        fpsFrameCount++;
        // 引擎可能晚于插件就绪 → 每帧廉价重试,挂上后自身立即 return
        if (!fpHooked) hookFramePhases();
        if (!fpPhysHooked) hookPhysics();
        // 每帧实时 DrawCall(通道 A 优先,否则通道 B 自计数帧增量)
        var pcDc = readPcDrawCalls();
        if (pcDc >= 0) {
            drawCallsCur = pcDc;
            drawCallSource = 'PlayCanvas drawCallsPerFrame';
        } else {
            drawCallsCur = drawCallCount - frameStartDrawCount;
            frameStartDrawCount = drawCallCount;
            drawCallSource = 'WebGL draw 自计数';
        }
        if (drawCallEl &amp;&amp; currentTab === 'perf') drawCallEl.textContent = String(drawCallsCur);
        var dt = ts - fpsTimeStart;
        if (dt > 3000) {
            // rAF 中断(后台/锁屏):跳过本样本,防止假低值污染 60s 统计
            fpsFrameCount = 0;
            fpsTimeStart = ts;
            requestAnimationFrame(fpsTick);
            return;
        }
        if (dt >= 1000) {
            var f = Math.round(fpsFrameCount * 1000 / dt);
            fpsFrameCount = 0;
            fpsTimeStart = ts;
            fpsSamples.push(f);
            if (fpsSamples.length > SAMPLE_MAX) fpsSamples.shift();
            var sum = 0, mn = 999, mx = 0;
            for (var i = 0; i &lt; fpsSamples.length; i++) {
                sum += fpsSamples[i];
                if (fpsSamples[i] &lt; mn) mn = fpsSamples[i];
                if (fpsSamples[i] > mx) mx = fpsSamples[i];
            }
            fpsCur = f;
            fpsAvg = fpsSamples.length ? Math.round(sum / fpsSamples.length) : 0;
            fpsMin = (mn === 999) ? 0 : mn;
            fpsMax = mx;
            fpsMedian = median(fpsSamples);
            // 内存采样
            var memMB = 0;
            if (hasRealMem()) {
                memMB = performance.memory.usedJSHeapSize / 1048576;
                memSamples.push(memMB);
                if (memSamples.length > SAMPLE_MAX) memSamples.shift();
            }
            // 启动期 30s 峰值
            if (performance.now() - bootTime &lt; STARTUP_PEAK_MS) {
                if (f &lt; startupPeakFpsMin) startupPeakFpsMin = f;
                if (memMB > startupPeakMemMax) startupPeakMemMax = memMB;
            }
            // DrawCall 每秒采样(实时值由每帧逻辑维护)
            drawCallSamples.push(drawCallsCur);
            if (drawCallSamples.length > SAMPLE_MAX) drawCallSamples.shift();
            // 帧阶段每秒结算:取本秒均值(单帧值抖动太大,看不出趋势)
            if (fpAcc.n > 0) {
                fpSec = {
                    frame: fpAcc.frame / fpAcc.n, update: fpAcc.update / fpAcc.n,
                    render: fpAcc.render / fpAcc.n, other: fpAcc.other / fpAcc.n, n: fpAcc.n
                };
                fpPhysSec = fpPhysAcc2 / fpAcc.n;
                fpSamples.push({ frame: fpSec.frame, update: fpSec.update, render: fpSec.render, other: fpSec.other });
                if (fpSamples.length > SAMPLE_MAX) fpSamples.shift();
                fpAcc = { frame: 0, update: 0, render: 0, other: 0, n: 0 };
                fpPhysAcc2 = 0;
            }
            // 每帧分配速率(MB/帧):GC 频率的直接驱动因素
            if (allocN > 0) { allocPerFrame = allocAcc / allocN; allocAcc = 0; allocN = 0; }
            // 阻塞率每秒结算(仅说明区显示,不占参数格)
            blockRate = Math.min(100, Math.round(longTaskMsInSec / 10));
            longTaskMsInSec = 0;
            if (currentTab === 'perf') { renderFpsView(); renderMemView(); }
        }
        requestAnimationFrame(fpsTick);
    }

        //         ? '启动耗时=页面加载→首帧渲染（Luna 官方口径）：' + (bootDrawTime / 1000).toFixed(1) + 's'
        //         : '启动耗时=页面加载→首帧渲染（等待引擎首帧…）') +

        renderBars(fpsBarsEl, fpsSamples, function (v) {

    // ===== 内存接口(按浏览器能力检测链选接口) =====
    // Chromium 实装 → performance.memory(JS 堆实时)
    // 无 performance.memory → navigator.storage.estimate(存储占用,全浏览器兜底)
    // 都没有 → N/A
    var storageTried = false;
    var storageInfo = null;       // {usage, quota}

    function hasRealMem() {
        return !!(window.performance &amp;&amp; window.performance.memory &amp;&amp;
            typeof window.performance.memory.usedJSHeapSize === 'number');
    }

    function refreshStorage(cb) {
        if (storageTried) { if (cb) cb(); return; }
        storageTried = true;
        try {
            if (navigator.storage &amp;&amp; typeof navigator.storage.estimate === 'function') {
                navigator.storage.estimate().then(function (r) {
                    storageInfo = (r &amp;&amp; typeof r.usage === 'number') ? r : null;
                    if (cb) cb();
                }, function () { if (cb) cb(); });
            } else { if (cb) cb(); }
        } catch (e) { if (cb) cb(); }
    }

    // ===== 系统信息(静态) =====
    function detectBrowser() {
        var ua = navigator.userAgent || '';
        var name = '未知浏览器', kernel = '', detail = '';
        if (/MicroMessenger/i.test(ua)) { name = '微信内置'; kernel = /Android|Xiaomi/i.test(ua) ? 'X5/Chromium' : 'WKWebView'; }
        else if (/QQBrowser|QQ\//i.test(ua)) { name = 'QQ浏览器'; kernel = 'Chromium'; }
        else if (/EdgA|Edg/i.test(ua)) { name = 'Edge'; kernel = 'Chromium'; }
        else if (/OPR|Opera/i.test(ua)) { name = 'Opera'; kernel = 'Chromium'; }
        else if (/SamsungBrowser/i.test(ua)) { name = '三星浏览器'; kernel = 'Chromium'; }
        else if (/MiuiBrowser/i.test(ua)) { name = '小米浏览器'; kernel = 'Chromium'; }
        else if (/HuaweiBrowser/i.test(ua)) { name = '华为浏览器'; kernel = 'Chromium'; }
        else if (/Firefox/i.test(ua)) { name = 'Firefox'; kernel = 'Gecko'; }
        else if (/CriOS/i.test(ua)) { name = 'Chrome(iOS)'; kernel = 'WebKit'; }
        else if (/Chrome/i.test(ua)) { name = 'Chrome'; kernel = 'Chromium'; }
        else if (/Safari/i.test(ua)) { name = 'Safari'; kernel = 'WebKit'; }
        else if (/Android/i.test(ua)) { name = '安卓默认浏览器'; kernel = 'Chromium'; }
        else if (/iPhone|iPad/i.test(ua)) { name = 'iOS 浏览器'; kernel = 'WebKit'; }
        return { name: name, kernel: kernel, detail: detail };
    }

    function guessIOSRam() {
        var ua = navigator.userAgent || '';
        var m = ua.match(/iPhone[^\s,;]*/i);
        if (!m) return '';
        var dev = m[0];
        var table = {
            'iPhone 6': 2, 'iPhone 6s': 2, 'iPhone SE': 3, 'iPhone 7': 3, 'iPhone 8': 3,
            'iPhone X': 3, 'iPhone XR': 3, 'iPhone XS': 4, 'iPhone 11': 4, 'iPhone 12': 4,
            'iPhone 13': 4, 'iPhone 14': 6, 'iPhone 15': 6, 'iPhone 16': 8
        };
        for (var k in table) {
            if (dev.indexOf(k) >= 0) return dev + ' (约 ' + table[k] + 'GB, 估算)';
        }
        return dev + ' (RAM 未知)';
    }

    function collectSysRows() {

    function fmtMB(n) {
        if (!n &amp;&amp; n !== 0) return '-';
        return (n / 1048576).toFixed(1) + ' MB';
    }

    function collectWebglInfo() {
        var rows = [];
        try {
            var canvas = document.querySelector('canvas');
            var gl = null;
            if (canvas) {
                try { gl = canvas.getContext('webgl2'); } catch (e) { gl = null; }
                if (!gl) {
                    try { gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl'); } catch (e) { gl = null; }
                }
            }
            if (!gl) {
                rows.push(['Canvas', canvas ? '未获取到 WebGL 上下文' : '页面暂无 canvas(引擎未启动?)']);
                return rows;
            }
            var isGL2 = false;
            try { isGL2 = (typeof WebGL2RenderingContext !== 'undefined' &amp;&amp; gl instanceof WebGL2RenderingContext); } catch (e) { isGL2 = false; }
            rows.push(['上下文', isGL2 ? 'WebGL2' : 'WebGL1']);
            rows.push(['GL 版本', String(gl.getParameter(gl.VERSION))]);
            rows.push(['GLSL 版本', String(gl.getParameter(gl.SHADING_LANGUAGE_VERSION))]);
            rows.push(['厂商', String(gl.getParameter(gl.VENDOR))]);
            rows.push(['渲染器', String(gl.getParameter(gl.RENDERER))]);
            rows.push(['最大纹理尺寸', String(gl.getParameter(gl.MAX_TEXTURE_SIZE))]);
            rows.push(['纹理单元数', String(gl.getParameter(gl.MAX_COMBINED_TEXTURE_IMAGE_UNITS))]);
            rows.push(['顶点属性数', String(gl.getParameter(gl.MAX_VERTEX_ATTRIBS))]);
            try {
                var ext = gl.getExtension('WEBGL_debug_renderer_info');
                if (ext) rows.push(['真实 GPU', String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL))]);
            } catch (e) { /* 忽略 */ }
            var comps = [];
            var compExts = [
                'EXT_texture_compression_astc', 'WEBGL_compressed_texture_s3tc',
                'WEBGL_compressed_texture_s3tc_srgb', 'WEBGL_compressed_texture_etc',
                'WEBGL_compressed_texture_etc1', 'WEBGL_compressed_texture_pvrtc',
                'WEBGL_compressed_texture_atc', 'EXT_texture_compression_bptc',
                'EXT_texture_compression_rgtc'
            ];
            for (var i = 0; i &lt; compExts.length; i++) {
                try {
                    if (gl.getExtension(compExts[i])) comps.push(compExts[i].replace(/^.*?_/, '').toUpperCase());
                } catch (e) { /* 忽略 */ }
            }
            rows.push(['压缩纹理', comps.length ? comps.join(', ') : '无']);
        } catch (e) {
            rows.push(['错误', String(e &amp;&amp; e.message || e)]);
        }
        return rows;
    }

    // ===== 启动页签(浏览器导航时序 / 三段启动 / 资源时间轴) =====
    function getNavTiming() {
        try {
            if (typeof performance !== 'undefined' &amp;&amp; performance.getEntriesByType) {
                var n = performance.getEntriesByType('navigation')[0];
                if (n) return n;
            }
        } catch (e) { /* 忽略 */ }
        try {
            if (typeof performance !== 'undefined' &amp;&amp; performance.timing &amp;&amp; performance.timing.navigationStart) {
                return performance.timing;
            }
        } catch (e) { /* 忽略 */ }
        return null;
    }

    function fmtMs(ms) {
        if (ms == null || isNaN(ms) || ms &lt; 0) return '-';
        if (ms >= 1000) return (ms / 1000).toFixed(2) + 's';
        return Math.round(ms) + 'ms';
    }

    // 函数耗时专用:单次调用常在亚毫秒级,fmtMs 的四舍五入会把它们全压成 0ms,
    // 于是&quot;每个函数多久&quot;就没了意义 → 小量保留小数。
    function fmtMsFine(ms) {
        if (ms == null || isNaN(ms) || ms &lt; 0) return '-';
        if (ms >= 1000) return (ms / 1000).toFixed(2) + 's';
        if (ms >= 100) return Math.round(ms) + 'ms';
        if (ms >= 10) return ms.toFixed(1) + 'ms';
        if (ms >= 0.01) return ms.toFixed(2) + 'ms';
        return ms > 0 ? '&lt;0.01ms' : '0';
    }

    function collectBootNavRows() {
        var n = getNavTiming();
        if (!n) return [{ section: '【导航时序】' }, ['导航时序', '不可用(浏览器不支持 PerformanceNavigationTiming)']];
        var base = (typeof n.startTime === 'number') ? n.startTime : (n.navigationStart || 0);
        var rows = [];
        rows.push({ section: '【导航时序】(相对导航起点)' });
        function span(a, b) { return (a &amp;&amp; b) ? fmtMs(b - a) : '-'; }
        function at(v) { return (v &amp;&amp; v > 0) ? fmtMs(v - base) : '-'; }
        rows.push(['DNS 解析', span(n.domainLookupStart, n.domainLookupEnd)]);
        rows.push(['TCP 连接', span(n.connectStart, n.connectEnd)]);
        rows.push(['TLS 握手', span(n.secureConnectionStart, n.connectEnd)]);
        rows.push(['首字节 TTFB', span(n.requestStart, n.responseStart)]);
        rows.push(['响应完成', at(n.responseEnd)]);
        rows.push(['DOMContentLoaded', at(n.domContentLoadedEventEnd)]);
        rows.push(['load 事件', at(n.loadEventEnd)]);
        return rows;
    }

    // 启动阶段 = 相邻实测锚点之间的区间。
    // 锚点来源三路,全部是真实时刻(performance.now 同一时间原点),不做任何推算:
    //   1) 导航时序 responseEnd —— 浏览器
    //   2) luna:* 事件           —— 引擎内部(资源包/贴图/预制体/场景加载...)
    //   3) BrowserLogViewer.mark —— 游戏 C# 上报(Awake/Start/首帧...)
    // 外加首次 WebGL draw 收尾。原实现只有第 3 路,故 C# Awake 之前全是一段黑盒。
    function computeStages() {
        var n = getNavTiming();
        var navBase = n ? (typeof n.startTime === 'number' ? n.startTime : (n.navigationStart || 0)) : 0;
        var res = [];
        try {
            if (typeof performance !== 'undefined' &amp;&amp; performance.getEntriesByType) {
                res = performance.getEntriesByType('resource') || [];
            }
        } catch (e) { /* 忽略 */ }
        var resStart = Infinity, resEnd = -Infinity;
        for (var i = 0; i &lt; res.length; i++) {
            var s = res[i].startTime;
            var e = res[i].responseEnd || (res[i].startTime + (res[i].duration || 0));
            if (s &lt; resStart) resStart = s;
            if (e > resEnd) resEnd = e;
        }
        mergeLunaStartup();

        var anchors = [];
        if (n &amp;&amp; n.responseEnd) anchors.push({ at: navBase + n.responseEnd, name: 'HTML 响应完成', detail: '导航 DNS/TCP/TLS/首字节', kind: 'nav' });
        for (var k = 0; k &lt; engineMarks.length; k++) {
            anchors.push({ at: engineMarks[k].at, name: engineMarks[k].label, detail: engineMarks[k].ev, kind: 'engine' });
        }
        for (var c = 0; c &lt; bootStages.length; c++) {
            anchors.push({ at: bootStages[c].at, name: bootStages[c].name, detail: '游戏 C# 上报', kind: 'custom' });
        }
        if (bootDrawTime > 0) anchors.push({ at: bootDrawTime, name: '首帧渲染', detail: 'WebGL 首次 draw', kind: 'draw' });
        anchors.sort(function (a, b) { return a.at - b.at; });

        // 段名取&quot;到达的锚点&quot;,即&quot;…→ 该锚点&quot;这一段的耗时
        var stages = [];
        var prev = navBase, prevName = '导航起点';
        for (var j = 0; j &lt; anchors.length; j++) {
            var a = anchors[j];
            if (a.at &lt; prev) continue;   // 时钟异常锚点跳过,不制造负数段
            stages.push({
                name: a.name, from: prev, to: a.at,
                detail: a.detail, kind: a.kind, prevName: prevName
            });
            prev = a.at; prevName = a.name;
        }
        return {
            stages: stages, navBase: navBase, firstDraw: bootDrawTime,
            resEnd: resEnd, resStart: resStart, resCount: res.length, res: res
        };
    }

    // 时间轴/百分比的分母:导航起点 → 最后一个锚点的**跨度**。
    // 注意不能用 firstDraw 之类的绝对时刻当分母 —— 段耗时是相对量,
    // 混用会让百分比失去意义(首帧之后的段还会超过 100%)。
    function bootTotalSpan(info) {
        if (info.stages.length) {
            var span = info.stages[info.stages.length - 1].to - info.navBase;
            if (span > 0) return span;
        }
        if (info.resEnd > 0 &amp;&amp; info.resEnd > info.navBase) return info.resEnd - info.navBase;
        return 1;
    }

    // 某个启动阶段窗口内下载的资源(用于阶段行下钻)。
    // 归属按&quot;开始下载时刻&quot;落在窗口内判定;跨段的长资源归到它开始的那一段。
    function stageResources(res, from, to) {
        var hit = [];
        for (var i = 0; i &lt; res.length; i++) {
            var r = res[i];
            var st = r.startTime;
            if (st >= from &amp;&amp; st &lt; to) hit.push(r);
        }
        hit.sort(function (a, b) { return (b.duration || 0) - (a.duration || 0); });
        return hit;
    }

    // 窗口内的主线程长任务(>50ms 的 JS 执行块)。
    // &quot;首帧渲染&quot;&quot;引擎初始化&quot;这类阶段没有网络请求,耗时全在这里 —— 只看资源必然是空的。
    function stageTasks(from, to) {
        var hit = [];
        for (var i = 0; i &lt; bootTasks.length; i++) {
            var t = bootTasks[i];
            if (t.start >= from &amp;&amp; t.start &lt; to) hit.push(t);
        }
        hit.sort(function (a, b) { return b.dur - a.dur; });
        return hit;
    }

    // 窗口内的 shader 编译/链接事件(真机首帧卡顿的头号元凶)
    function stageShaders(from, to) {
        var hit = [];
        for (var i = 0; i &lt; shaderEvents.length; i++) {
            var s = shaderEvents[i];
            if (s.at >= from &amp;&amp; s.at &lt; to) hit.push(s);
        }
        hit.sort(function (a, b) { return b.ms - a.ms; });
        return hit;
    }

    // 窗口内首次被调用的函数。用&quot;首次调用时刻&quot;归属:
    // 一个函数只会归给它第一次出现的那个阶段,便于看出&quot;这一段在跑什么代码&quot;。
    function stageFns(from, to) {
        var hit = [];
        for (var k in fnStats) {
            if (!Object.prototype.hasOwnProperty.call(fnStats, k)) continue;
            var f = fnStats[k];
            if (f.n > 0 &amp;&amp; f.first >= from &amp;&amp; f.first &lt; to) hit.push(f);
        }
        hit.sort(function (a, b) {
            if (b.self !== a.self) return b.self - a.self;
            return b.n - a.n;
        });
        return hit;
    }


    function resKind(r) {
        var n = (r.name || '').toLowerCase().split('?')[0];
        var it = r.initiatorType || '';
        if (/\.wasm(\.|$)/.test(n) || /\.wasm\.br$|\.wasm\.gz$/.test(n)) return 'wasm';
        if (/\.data(\.|$)|\.bundle$|\.unity3d$|\.pak$/.test(n)) return 'data(资源包)';
        if (/\.js(\.|$)|\.mjs$/.test(n) || it === 'script') return 'js';
        if (/\.(png|jpg|jpeg|webp|ktx2?|astc|basis|dds|pvr)$/.test(n) || it === 'img') return '贴图';
        if (/\.(mp3|ogg|wav|m4a|aac)$/.test(n)) return '音频';
        if (/\.css$/.test(n) || it === 'css' || it === 'link') return 'css';
        if (/\.(json|txt|bin|bytes)$/.test(n)) return '数据';
        if (/\.(ttf|otf|woff2?)$/.test(n)) return '字体';
        return it || '其他';
    }

    function renderShaderBlock() {
        if (!bootShaderEl) return;
        bootShaderEl.innerHTML = '';
        if (!shaderCompileCount &amp;&amp; !shaderLinkCount) {
            var none = makeEl('div', { color: '#9aa4b1', padding: '4px 8px', fontSize: '11px', whiteSpace: 'pre-wrap' });
            none.textContent = '暂无 shader 编译记录\n(等待引擎创建 WebGL 上下文并编译)';
            bootShaderEl.appendChild(none);
            return;
        }
        // 只报次数与时间窗:驱动异步编译,compileShader/linkProgram 的同步耗时恒为 0,
        // 报出来只会误导(看着像&quot;零开销&quot;)。真开销在 GPU 侧,浏览器不给。
        var rows = [];
        rows.push(['编译次数', shaderCompileCount + ' 次']);
        rows.push(['链接次数', shaderLinkCount + ' 次']);
        if (shaderFirstAt) {
            rows.push(['编译时间窗', fmtMs(shaderFirstAt) + '  →  ' + fmtMs(shaderLastAt)]);
        }

        var note = makeEl('div', { fontSize: '9px', color: '#9aa4b1', padding: '3px 8px', whiteSpace: 'pre-wrap' });
        note.textContent = '注:驱动异步编译,同步耗时无意义故不显示。\n关注&quot;次数&quot;与&quot;运行期编译&quot;——运行期编译才是卡顿元凶。';
        bootShaderEl.appendChild(note);
    }

    function renderBlockTimeline(navBase) {
        if (!bootBlockEl) return;
        bootBlockEl.innerHTML = '';
        if (!bootTasks.length) {
            var none = makeEl('div', { color: '#9aa4b1', padding: '4px 8px', fontSize: '11px', whiteSpace: 'pre-wrap' });
            none.textContent = ltNote()
                ? ('⚠ ' + ltNote())
                : ('启动前 ' + Math.round(BOOT_WINDOW_MS / 1000) + 's 无长任务(或页面已运行超过该窗口才打开面板)');
            bootBlockEl.appendChild(none);
            return;
        }
        var span = BOOT_WINDOW_MS;
        var totalBlock = 0;
        for (var i = 0; i &lt; bootTasks.length; i++) totalBlock += bootTasks[i].dur;
        // 汇总行
        var sum = makeEl('div', { fontSize: '11px', color: '#9aa4b1', padding: '4px 8px' });
        sum.textContent = '前 ' + Math.round(span / 1000) + 's 阻塞 ' + fmtMs(totalBlock) + '  |  长任务 ' + bootTasks.length + ' 个  |  占比 ' + Math.round(totalBlock / span * 100) + '%';
        bootBlockEl.appendChild(sum);
        // 时间轴画布
        var track = makeEl('div', {
            position: 'relative', height: '34px', margin: '2px 8px 4px',
            background: 'rgba(255,255,255,0.05)', borderRadius: '3px', overflow: 'hidden'
        });
        for (var j = 0; j &lt; bootTasks.length; j++) {
            var t = bootTasks[j];
            var l = Math.max(0, Math.min(100, t.start / span * 100));
            var w = Math.max(0.4, Math.min(100 - l, t.dur / span * 100));
            var col = t.dur >= 200 ? '#ff6b6b' : (t.dur >= 100 ? '#ffd54f' : '#4a9eff');
            var bar = makeEl('div', {
                position: 'absolute', top: '0', left: l + '%', width: w + '%', height: '100%',
                background: col, opacity: '0.85'
            });
            bar.title = fmtMs(t.dur) + ' @' + fmtMs(t.start);
            track.appendChild(bar);
        }
        // 标记线:资源下载完成 / 首帧
        var marks = [];
        var info = computeStages();
        if (info.resEnd > 0 &amp;&amp; info.resEnd &lt; span) marks.push({ at: info.resEnd, color: '#6bc46b', label: '资源完' });
        if (bootDrawTime > 0 &amp;&amp; bootDrawTime &lt; span) marks.push({ at: bootDrawTime, color: '#fff', label: '首帧' });
        for (var m = 0; m &lt; marks.length; m++) {
            var ml = makeEl('div', {
                position: 'absolute', top: '0', left: (marks[m].at / span * 100) + '%',
                width: '2px', height: '100%', background: marks[m].color
            });
            ml.title = marks[m].label + ' ' + fmtMs(marks[m].at);
            track.appendChild(ml);
        }
        bootBlockEl.appendChild(track);
        var legend = makeEl('div', { fontSize: '9px', color: '#9aa4b1', padding: '0 8px 4px', whiteSpace: 'pre-wrap' });
        legend.textContent = '0s ─────────────── ' + Math.round(BOOT_WINDOW_MS / 1000) + 's   红≥200ms 黄≥100ms 蓝&lt;100ms\n绿竖线=资源下载完  白竖线=首帧渲染\n资源完之后的密集阻塞 ≈ 解压/引擎初始化/shader 编译';
        bootBlockEl.appendChild(legend);
    }

    function renderTypeTable() {
        if (!bootTypeEl) return;
        bootTypeEl.innerHTML = '';
        var res = [];
        try {
            if (typeof performance !== 'undefined' &amp;&amp; performance.getEntriesByType) res = performance.getEntriesByType('resource') || [];
        } catch (e) { /* 忽略 */ }
        if (!res.length) {
            var none = makeEl('div', { color: '#9aa4b1', padding: '4px 8px', fontSize: '11px' });
            none.textContent = '无资源记录';
            bootTypeEl.appendChild(none);
            return;
        }
        var map = {}, order = [];
        for (var i = 0; i &lt; res.length; i++) {
            var r = res[i];
            var k = resKind(r);
            if (!map[k]) { map[k] = { n: 0, enc: 0, dec: 0, ms: 0, cached: 0, maxEnd: 0, minStart: Infinity }; order.push(k); }
            var g = map[k];
            g.n++;
            g.enc += (r.encodedBodySize || 0);
            g.dec += (r.decodedBodySize || 0);
            g.ms += (r.duration || 0);
            if ((r.transferSize || 0) === 0 &amp;&amp; (r.decodedBodySize || 0) > 0) g.cached++;
            var e = r.responseEnd || (r.startTime + (r.duration || 0));
            if (e > g.maxEnd) g.maxEnd = e;
            if (r.startTime &lt; g.minStart) g.minStart = r.startTime;
        }
        order.sort(function (a, b) { return map[b].enc - map[a].enc; });
        // 表头
        var hd = makeEl('div', { display: 'flex', fontSize: '9px', color: '#9aa4b1', padding: '3px 8px', borderBottom: '1px solid rgba(255,255,255,0.15)' });
        [['类型', '78px'], ['个', '26px'], ['传输', '58px'], ['解压后', '58px'], ['墙钟', '52px']].forEach(function (c) {
            var d = makeEl('div', { width: c[1], flex: c[0] === '类型' ? '1' : 'none', textAlign: c[0] === '类型' ? 'left' : 'right' });
            d.textContent = c[0];
            hd.appendChild(d);
        });
        bootTypeEl.appendChild(hd);
        for (var j = 0; j &lt; order.length; j++) {
            var key = order[j], g2 = map[key];
            var row = makeEl('div', { display: 'flex', fontSize: '10px', padding: '2px 8px', borderBottom: '1px solid rgba(255,255,255,0.06)' });
            var c0 = makeEl('div', { flex: '1', color: '#fff', overflow: 'hidden', whiteSpace: 'nowrap' });
            c0.textContent = key + (g2.cached ? ' (缓存' + g2.cached + ')' : '');
            var c1 = makeEl('div', { width: '26px', flex: 'none', textAlign: 'right', color: '#9aa4b1' });
            c1.textContent = String(g2.n);
            var c2 = makeEl('div', { width: '58px', flex: 'none', textAlign: 'right', color: '#ffd54f' });
            c2.textContent = fmtSize(g2.enc);
            var c3 = makeEl('div', { width: '58px', flex: 'none', textAlign: 'right', color: '#9aa4b1' });
            c3.textContent = g2.dec ? fmtSize(g2.dec) : '-';
            var c4 = makeEl('div', { width: '52px', flex: 'none', textAlign: 'right', color: '#c8c8c8' });
            c4.textContent = fmtMs(g2.maxEnd - g2.minStart);
            row.appendChild(c0); row.appendChild(c1); row.appendChild(c2); row.appendChild(c3); row.appendChild(c4);
            bootTypeEl.appendChild(row);
            if (g2.dec > g2.enc &amp;&amp; g2.enc > 0) {
                var cr = makeEl('div', { fontSize: '9px', color: '#6bc46b', padding: '0 8px 2px' });
                cr.textContent = '  压缩比 ' + (g2.dec / g2.enc).toFixed(1) + 'x  → 解压开销计入主线程阻塞';
                bootTypeEl.appendChild(cr);
            }
        }
        var note = makeEl('div', { fontSize: '9px', color: '#9aa4b1', padding: '3px 8px', whiteSpace: 'pre-wrap' });
        note.textContent = '墙钟=该类首个开始到最后结束(含并发重叠)\n传输 0 且有解压后大小 = 命中缓存';
        bootTypeEl.appendChild(note);
    }

    // 阶段颜色按锚点来源区分:蓝=浏览器导航 橙=引擎内部 绿=游戏 C# 上报 紫=首帧
    var STAGE_COLOR = { nav: '#4a9eff', engine: '#ff9f4a', custom: '#6bc46b', draw: '#b98cff' };

    // 阶段行下钻:把该阶段的耗时拆成「下载 / Shader / 主线程长任务 / 函数」四类。
    // 只列资源是不够的 —— &quot;首帧渲染&quot;&quot;引擎初始化&quot;这类阶段根本没有网络请求,
    // 时间全花在 CPU 上,只查资源的话展开必然是空的。
    function appendStageDrill(container, info, st) {
        var box = makeEl('div', { background: 'rgba(255,255,255,0.03)', padding: '2px 0 4px' });
        var dur = st.to - st.from;
        var res = stageResources(info.res, st.from, st.to);
        var tasks = stageTasks(st.from, st.to);
        var shs = stageShaders(st.from, st.to);
        var fns = stageFns(st.from, st.to);

        function sub(title, color) {
            var h = makeEl('div', { fontSize: '9px', color: color, padding: '3px 8px 1px 128px', fontWeight: 'bold' });
            h.textContent = title;
            box.appendChild(h);
        }
        function line(a, b, c, ca, cb, cc) {
            var l = makeEl('div', { display: 'flex', fontSize: '9px', padding: '1px 8px 1px 128px' });
            var e1 = makeEl('div', { flex: '1', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: ca || '#c8c8c8' });
            e1.textContent = a;
            e1.title = a;
            var e2 = makeEl('div', { width: '52px', flex: 'none', textAlign: 'right', color: cb || '#9aa4b1' });
            e2.textContent = b;
            var e3 = makeEl('div', { width: '58px', flex: 'none', textAlign: 'right', color: cc || '#6bc46b' });
            e3.textContent = c;
            l.appendChild(e1); l.appendChild(e2); l.appendChild(e3);
            box.appendChild(l);
        }

        // ---- 耗时归因汇总:这一段的时间到底花在哪 ----
        var blockMs = 0;
        for (var t = 0; t &lt; tasks.length; t++) blockMs += tasks[t].dur;
        var shMs = 0;
        for (var q = 0; q &lt; shs.length; q++) shMs += shs[q].ms;
        var acc = makeEl('div', { fontSize: '9px', color: '#ffd54f', padding: '2px 8px 2px 128px', whiteSpace: 'pre-wrap' });
        var accTxt = '本段 ' + fmtMs(dur) + '  ·  主线程阻塞 ' + fmtMs(blockMs) +
            (dur > 0 ? ' (' + Math.round(blockMs / dur * 100) + '%)' : '');
        if (shMs > 0) accTxt += '  ·  Shader ' + fmtMs(shMs);
        if (res.length) accTxt += '  ·  ' + res.length + ' 请求';
        acc.textContent = accTxt;
        box.appendChild(acc);

        // ---- Shader(真机首帧卡顿头号元凶,排前面) ----
        if (shs.length) {
            sub('Shader 编译/链接  ' + shs.length + ' 次 / ' + fmtMs(shMs), '#b98cff');
            for (var s = 0; s &lt; Math.min(shs.length, 8); s++) {
                line(shs[s].kind, '@' + fmtMs(shs[s].at - info.navBase), fmtMsFine(shs[s].ms), '#c8c8c8', '#9aa4b1', '#b98cff');
            }
        }

        // ---- 主线程长任务 ----
        if (tasks.length) {
            sub('主线程长任务  ' + tasks.length + ' 个 / ' + fmtMs(blockMs), '#ff6b6b');
            for (var k = 0; k &lt; Math.min(tasks.length, 8); k++) {
                line('长任务 #' + (k + 1), '@' + fmtMs(tasks[k].start - info.navBase), fmtMs(tasks[k].dur), '#c8c8c8', '#9aa4b1', '#ff6b6b');
            }
        }

        // ---- 该段首次执行的函数(要开函数剖析才有) ----
        if (fns.length) {
            sub('本段首次执行的函数  ' + fns.length + ' 个', '#6bc46b');
            for (var f = 0; f &lt; Math.min(fns.length, 10); f++) {
                var fn = fns[f];
                line(fn.name, fn.n + '次', fn.self > 0 ? fmtMsFine(fn.self) : '-',
                    fn.user ? '#6bc46b' : '#c8c8c8', '#9aa4b1', '#ffd54f');
            }
            if (fns.length > 10) {
                line('… 另有 ' + (fns.length - 10) + ' 个(见【函数】页签)', '', '', '#9aa4b1');
            }
        }

        // ---- 网络请求 ----
        if (res.length) {
            var sumEnc = 0, sumDec = 0;
            for (var a = 0; a &lt; res.length; a++) {
                sumEnc += (res[a].encodedBodySize || 0);
                sumDec += (res[a].decodedBodySize || 0);
            }
            sub('网络请求  ' + res.length + ' 个 / 传输 ' + fmtSize(sumEnc) +
                (sumDec > sumEnc ? ' / 解压后 ' + fmtSize(sumDec) : ''), '#4a9eff');
            for (var i = 0; i &lt; Math.min(res.length, 10); i++) {
                var r = res[i];
                var end = r.responseEnd || (r.startTime + (r.duration || 0));
                var nm = (r.name || '').split('?')[0];
                line((nm.split('/').pop() || nm) + '  [' + resKind(r) + ']',
                    ((r.transferSize || 0) === 0 &amp;&amp; (r.decodedBodySize || 0) > 0) ? '缓存' : fmtSize(r.encodedBodySize || 0),
                    fmtMs(end - r.startTime));
            }
            if (res.length > 10) {
                line('… 另有 ' + (res.length - 10) + ' 个(见【资源时间轴】)', '', '', '#9aa4b1');
            }
        }

        // ---- 全空时给出可执行的下一步,而不是一句&quot;无数据&quot; ----
        if (!res.length &amp;&amp; !tasks.length &amp;&amp; !shs.length &amp;&amp; !fns.length) {
            var no = makeEl('div', { fontSize: '9px', color: '#9aa4b1', padding: '2px 8px 2px 128px', whiteSpace: 'pre-wrap' });
            var why = '本段无网络请求、无长任务(>50ms)、无 Shader 编译记录。';
            if (!fnDefinePatched) {
                why += '\n函数剖析未挂上钩子 → 看不到 CPU 明细。';
            } else if (fnLevel === FN_OFF) {
                why += '\n函数剖析当前为「关闭」→ 去【函数】页签切到「游戏脚本」或「全量」,再重载页面。';
            } else {
                why += '\n耗时可能在引擎原生层(WASM/GPU),JS 侧观测不到;\n或该段本身很短,未触发 50ms 长任务阈值。';
            }
            if (typeof PerformanceObserver === 'undefined') {
                why += '\n⚠ 本浏览器不支持 longtask 观测(Safari/iOS),主线程阻塞数据不可用。';
            } else if (ltNote()) {
                why += '\n⚠ ' + ltNote();
            }
            no.textContent = why;
            box.appendChild(no);
        }
        container.appendChild(box);
    }

    function renderBootView() {
        if (!bootNavEl || !bootStageEl || !bootResEl) return;
        // lunaStartup 数据是引擎渐进写入的,每次渲染前都补一次,确保不漏锚点
        mergeLunaStartup();
        // 导航时序表
        renderInfoTable(bootNavEl, collectBootNavRows());
        // 启动阶段
        var info = computeStages();
        bootStageEl.innerHTML = '';
        var total = bootTotalSpan(info);
        if (!info.stages.length) {
            var empty = makeEl('div', { color: '#9aa4b1', padding: '4px 8px', fontSize: '11px' });
            empty.textContent = '暂无数据(等待首帧 draw 或资源加载)';
            bootStageEl.appendChild(empty);
        }
        // 总耗时 + 图例
        if (info.stages.length) {
            var lastTo = info.stages[info.stages.length - 1].to;
            var hdr = makeEl('div', { fontSize: '10px', color: '#fff', padding: '3px 8px', borderBottom: '1px solid rgba(255,255,255,0.15)' });
            hdr.textContent = '总计 ' + fmtMs(lastTo - info.navBase) + '  ·  ' + info.stages.length + ' 段实测  ·  点行展开资源明细';
            bootStageEl.appendChild(hdr);
        }
        for (var i = 0; i &lt; info.stages.length; i++) {
            var st = info.stages[i];
            var dur = st.to - st.from;
            var pct = total > 0 ? (dur / total * 100) : 0;
            var row = makeEl('div', { display: 'flex', alignItems: 'center', padding: '3px 8px', fontSize: '11px', borderBottom: '1px solid rgba(255,255,255,0.08)' });
            var name = makeEl('div', { width: '120px', flex: 'none', color: STAGE_COLOR[st.kind] || '#fff', overflow: 'hidden', whiteSpace: 'nowrap' });
            name.textContent = (stageOpen[st.name] ? '▾ ' : '▸ ') + st.name;
            name.title = st.prevName + '  →  ' + st.name;
            var barWrap = makeEl('div', { flex: '1', height: '14px', background: 'rgba(255,255,255,0.06)', borderRadius: '3px', position: 'relative', overflow: 'hidden' });
            var leftPct = Math.max(0, (st.from - info.navBase) / total * 100);
            var widthPct = Math.max(1, pct);
            var bar = makeEl('div', {
                position: 'absolute', top: '0', left: leftPct + '%', width: widthPct + '%', height: '100%',
                background: STAGE_COLOR[st.kind] || '#ff9f4a', borderRadius: '3px'
            });
            barWrap.appendChild(bar);
            var durEl = makeEl('div', { width: '70px', flex: 'none', textAlign: 'right', color: '#ffd54f', fontWeight: 'bold' });
            durEl.textContent = fmtMs(dur);
            row.appendChild(name);
            row.appendChild(barWrap);
            row.appendChild(durEl);
            (function (stage) {
                row.addEventListener('click', function () {
                    stageOpen[stage.name] = !stageOpen[stage.name];
                    renderBootView();
                });
            })(st);
            bootStageEl.appendChild(row);
            var detailEl = makeEl('div', { fontSize: '9px', color: '#9aa4b1', padding: '0 8px 2px 128px' });
            detailEl.textContent = st.detail + '  ·  ' + pct.toFixed(1) + '%  ·  ' +
                fmtMs(st.from - info.navBase) + ' → ' + fmtMs(st.to - info.navBase);
            bootStageEl.appendChild(detailEl);
            if (stageOpen[st.name]) appendStageDrill(bootStageEl, info, st);
        }
        var lgd = makeEl('div', { fontSize: '9px', color: '#9aa4b1', padding: '3px 8px', whiteSpace: 'pre-wrap' });
        lgd.textContent = '蓝=浏览器导航  橙=引擎内部(实测)  绿=游戏 C# 上报  紫=首帧\n' +
            '段名 = 到达该锚点这一段的耗时;引擎锚点由 luna:* 事件实测,非推算' +
            (engineMarks.length ? '' : '\n⚠ 未收到引擎 luna:* 事件(插件注入过晚或非 Luna 包),已退化为仅 C# 上报锚点');
        bootStageEl.appendChild(lgd);
        // Shader / 阻塞时间轴 / 资源类型
        renderShaderBlock();
        // renderBlockTimeline 移除:longtask 在目标设备(Chromecast 内核)不支持,永远是空图
        renderTypeTable();
        // 资源时间轴
        bootResEl.innerHTML = '';
        var res = [];
        try {
            if (typeof performance !== 'undefined' &amp;&amp; performance.getEntriesByType) res = performance.getEntriesByType('resource') || [];
        } catch (e) { /* 忽略 */ }
        if (!res.length) {
            var nr = makeEl('div', { color: '#9aa4b1', padding: '4px 8px', fontSize: '11px' });
            nr.textContent = '无资源记录';
            bootResEl.appendChild(nr);
            return;
        }
        var maxT = total;
        for (var j = 0; j &lt; res.length; j++) {
            var r = res[j];
            var e = r.responseEnd || (r.startTime + (r.duration || 0));
            var rrow = makeEl('div', { display: 'flex', alignItems: 'center', padding: '1px 8px', fontSize: '10px' });
            var rname = makeEl('div', { width: '104px', flex: 'none', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: '#c8c8c8' });
            var nm = r.name || '';
            rname.textContent = nm.split('/').pop() || nm;
            rname.title = nm + '\n排队 ' + fmtMs((r.requestStart || r.startTime) - r.startTime) +
                '  TTFB ' + fmtMs((r.responseStart || 0) - (r.requestStart || 0)) +
                '  下载 ' + fmtMs(e - (r.responseStart || r.startTime));
            var rwrap = makeEl('div', { flex: '1', height: '9px', background: 'rgba(255,255,255,0.05)', position: 'relative', overflow: 'hidden' });
            // 分段:排队(灰) / 等待TTFB(黄) / 下载(绿)
            var segs = [];
            var qEnd = r.requestStart || r.startTime;
            var rStart = r.responseStart || qEnd;
            if (qEnd > r.startTime) segs.push([r.startTime, qEnd, '#7a7a7a']);
            if (rStart > qEnd) segs.push([qEnd, rStart, '#ffd54f']);
            segs.push([rStart, e, '#6bc46b']);
            for (var s = 0; s &lt; segs.length; s++) {
                var sl = Math.max(0, (segs[s][0] - info.navBase) / maxT * 100);
                var sw = Math.max(0.3, (segs[s][1] - segs[s][0]) / maxT * 100);
                rwrap.appendChild(makeEl('div', {
                    position: 'absolute', top: '0', left: sl + '%', width: sw + '%', height: '100%',
                    background: segs[s][2], opacity: '0.85'
                }));
            }
            var rsz = makeEl('div', { width: '50px', flex: 'none', textAlign: 'right', color: '#9aa4b1' });
            var enc = r.encodedBodySize || 0;
            rsz.textContent = (r.transferSize === 0 &amp;&amp; r.decodedBodySize) ? '缓存' : fmtSize(enc);
            rrow.appendChild(rname);
            rrow.appendChild(rwrap);
            rrow.appendChild(rsz);
            bootResEl.appendChild(rrow);
        }
        var lg = makeEl('div', { fontSize: '9px', color: '#9aa4b1', padding: '3px 8px', whiteSpace: 'pre-wrap' });
        lg.textContent = '灰=排队  黄=等首字节  绿=下载中(长按/悬停看分段耗时)';
        bootResEl.appendChild(lg);
    }

        var cnt = makeEl('div', { fontSize: '9px', color: '#9aa4b1', padding: '2px 8px' });
        cnt.textContent = list.length + ' 个函数被调用过' + (timed ? '' : '  (当前档位不计时,耗时列为 -)');
        fnHeadEl.appendChild(cnt);

        fnListEl.innerHTML = '';
        if (!list.length) {
            var no = makeEl('div', { color: '#9aa4b1', padding: '4px 8px', fontSize: '11px', whiteSpace: 'pre-wrap' });
            no.textContent = fnDefinePatched
                ? '暂无记录(等待游戏代码执行,或档位为关闭)'
                : '钩子未挂上,无法采集。\n函数级剖析要求插件早于引擎脚本执行:\n本插件注入 &lt;head>,引擎脚本在 &lt;body> 且带 defer,正常情况满足。';
            fnListEl.appendChild(no);
            return;
        }
        var top = list.slice(0, 200);
        var maxSelf = 0;
        for (var m = 0; m &lt; top.length; m++) if (top[m].self > maxSelf) maxSelf = top[m].self;
        for (var j = 0; j &lt; top.length; j++) {
            var f = top[j];
            var row = makeEl('div', { display: 'flex', fontSize: '10px', padding: '2px 8px', borderBottom: '1px solid rgba(255,255,255,0.06)' });
            var c0 = makeEl('div', { flex: '1', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: f.user ? '#6bc46b' : '#c8c8c8' });
            c0.textContent = f.name;
            c0.title = f.name + '\n首次 ' + fmtMs(f.first) + '  末次 ' + fmtMs(f.last);
            var c1 = makeEl('div', { width: '44px', flex: 'none', textAlign: 'right', color: '#fff' });
            c1.textContent = f.n >= 10000 ? (f.n / 1000).toFixed(0) + 'k' : String(f.n);
            var c2 = makeEl('div', { width: '52px', flex: 'none', textAlign: 'right', color: '#ffd54f', fontWeight: 'bold' });
            c2.textContent = f.self > 0 ? fmtMsFine(f.self) : '-';
            var c3 = makeEl('div', { width: '52px', flex: 'none', textAlign: 'right', color: '#9aa4b1' });
            c3.textContent = f.incl > 0 ? fmtMsFine(f.incl) : '-';
            var c4 = makeEl('div', { width: '46px', flex: 'none', textAlign: 'right', color: '#ff9f4a' });
            c4.textContent = f.max > 0 ? fmtMsFine(f.max) : '-';
            row.appendChild(c0); row.appendChild(c1); row.appendChild(c2); row.appendChild(c3); row.appendChild(c4);
            fnListEl.appendChild(row);
            // 自身耗时占比条
            if (maxSelf > 0 &amp;&amp; f.self > 0) {
                var bw = makeEl('div', { height: '2px', background: 'rgba(255,255,255,0.05)', margin: '0 8px 1px' });
                bw.appendChild(makeEl('div', {
                    height: '100%', width: Math.max(0.5, f.self / maxSelf * 100) + '%',
                    background: f.user ? '#6bc46b' : '#4a9eff'
                }));
                fnListEl.appendChild(bw);
            }
        }
        var note = makeEl('div', { fontSize: '9px', color: '#9aa4b1', padding: '3px 8px', whiteSpace: 'pre-wrap' });
        note.textContent = '绿=游戏脚本  蓝灰=引擎/框架\n' +
            '自身=扣掉被插桩子调用后的耗时  含子=函数整体墙钟  最大=单次最慢\n' +
            (list.length > top.length ? '仅列前 ' + top.length + ' 条(共 ' + list.length + ')\n' : '') +
            '注:只插桩 methods/静态 methods,构造与属性访问器不计';
        fnListEl.appendChild(note);
    }

    // ===== 纯文本启动报告(手机上复制回传用) =====
    function bootReport() {
        var info = computeStages();
        var L = [];
        L.push('===== 启动分析报告 =====');
        // 采集环境放最前:拿桌面/编辑器数据推断低端机是最常见的错误,
        // 分辨率和 DPR 直接决定 fillrate,没有它这份报告不具备可比性。
        L.push('采集环境: ' + envLine());
        var gpu = gpuLine();
        if (gpu) L.push('GPU: ' + gpu);
        // 能力状态:不知道哪些数据缺失,底下的 0 会被误读成&quot;没问题&quot;
        var capLine = '数据可用性: ';
        capLine += '帧事件 ' + (fpHooked ? '✓' : '✗');
        capLine += ' · 函数剖析 ' + (fnDefinePatched ? '✓' : '✗');

        capLine += ' · GPU 时间 ✗';
        capLine += ' · 业务负载 ' + (loadLastAt > 0 ? '✓' : '✗');
        L.push(capLine);
        // 缺失项必须写清原因和替代方案,否则读者会把「没数据」当成「没问题」
        var miss = [];
        if (heapMB() &lt;= 0) miss.push('内存/GC: ' + memNote().split('\n')[0]);
        miss.push('GPU 时间: 浏览器已禁用 timer query 扩展(Spectre 后),任何 JS 手段都取不到 —— ' +
            '下方 render 是主线程提交耗时,不含 GPU 执行。要 GPU 数据须打原生包用 GPU Inspector/Snapdragon Profiler。');
        if (loadLastAt &lt;= 0) miss.push('业务负载: 游戏侧未调用 BrowserLogViewer.load({enemy:N,...}) —— ' +
            '函数调用次数缺少分母,无法判断是设计如此还是数量失控。');
        if (!fnDefinePatched) miss.push('函数剖析: 未挂上 Bridge.define 钩子,无代码级明细。');
        for (var mi = 0; mi &lt; miss.length; mi++) L.push('  ✗ ' + miss[mi]);
        if (info.stages.length) {
            var lastTo = info.stages[info.stages.length - 1].to;

        }
        L.push('锚点来源: 导航时序 + luna:* 引擎事件(' + engineMarks.length + ') + C# 上报(' + bootStages.length + ')');
        L.push('');
        L.push('--- 启动阶段(实测,非推算) ---');
        var total = bootTotalSpan(info);
        for (var i = 0; i &lt; info.stages.length; i++) {
            var st = info.stages[i];
            var dur = st.to - st.from;
            L.push(pad(st.name, 26) + ' ' + padL(fmtMs(dur), 8) +
                '  ' + padL((total > 0 ? (dur / total * 100).toFixed(1) : '0') + '%', 6) +
                '  [' + fmtMs(st.from - info.navBase) + ' → ' + fmtMs(st.to - info.navBase) + ']  ' + st.detail);
        }
        if (!engineMarks.length) L.push('⚠ 未收到引擎 luna:* 事件,场景/资源阶段缺失');
        L.push('');
        L.push('--- Shader ---');
        L.push('编译 ' + shaderCompileCount + ' 次 / ' + fmtMs(shaderCompileMs) +
            '   链接 ' + shaderLinkCount + ' 次 / ' + fmtMs(shaderLinkMs) +
            '   状态读取阻塞 ' + fmtMs(shaderStallMs));
        L.push('');
        L.push('--- 帧耗时拆分 ---');
        L.push('口径: 主线程墙钟,不含 GPU 执行与合成。render = CPU 提交 draw call 的时间。');
        if (!fpHooked) {
            L.push('⚠ 未挂上引擎帧事件,无帧阶段数据');
        } else if (!fpSec.n) {
            L.push('采集中(每秒结算一次)');
        } else {
            // 全程分位数放前面:「本秒均值」只代表结算那一秒,拿它当全程结论是最常见的误读
            if (fpHistN > 0) {
                L.push('[全程 ' + fpHistN + ' 帧] P50 ' + fpHistPct(0.50) + 'ms · P95 ' + fpHistPct(0.95) +
                    'ms · P99 ' + fpHistPct(0.99) + 'ms · 最慢 ' + fmtMsFine(fpPeak.frame));
            }
            L.push('[最近一秒 ' + fpSec.n + ' 帧] 均值 / 全程峰值');
            L.push(pad('帧总计', 22) + padL(fmtMsFine(fpSec.frame), 10) + padL(fmtMsFine(fpPeak.frame), 10));
            L.push(pad('  update(脚本/动画)', 22) + padL(fmtMsFine(fpSec.update), 10) + padL(fmtMsFine(fpPeak.update), 10));
            L.push(pad('  render(CPU 提交)', 22) + padL(fmtMsFine(fpSec.render), 10) + padL(fmtMsFine(fpPeak.render), 10));
            L.push(pad('  物理', 22) + padL(fpPhysHooked ? fmtMsFine(fpPhysSec) : '-', 10));
            L.push(pad('  其他', 22) + padL(fmtMsFine(fpSec.other), 10));
        }
        L.push('');
        // 业务负载:函数调用次数的分母。没有它,「Insert 调用 96 万次」无法解读。
        L.push('--- 业务负载(游戏侧上报) ---');
        var lkeys = [];
        for (var lk in loadStats) {
            if (Object.prototype.hasOwnProperty.call(loadStats, lk)) lkeys.push(lk);
        }
        if (!lkeys.length) {
            L.push('✗ 无数据。游戏侧调用 BrowserLogViewer.load({enemy:N, meat:M}) 上报即可。');
            L.push('  缺了它,下方函数剖析的调用次数没有分母 —— 无法区分');
            L.push('  「对象少但每帧重复处理」和「对象数量失控」,而这两者修法完全相反。');
        } else {
            lkeys.sort();
            L.push(pad('名称', 16) + padL('当前', 8) + padL('均值', 8) + padL('峰值', 8) + padL('样本', 8));
            for (var l1 = 0; l1 &lt; lkeys.length; l1++) {
                var lg = loadStats[lkeys[l1]];
                L.push(pad(lg.name, 16) + padL(String(lg.last), 8) +
                    padL((lg.n > 0 ? (lg.sum / lg.n).toFixed(1) : '-'), 8) +
                    padL(String(lg.max), 8) + padL(String(lg.n), 8));
            }
        }
        L.push('');
        var dl = dcList();
        L.push('--- DrawCall 归因(按 shader 程序,' + dl.length + ' 个) ---');
        if (!dl.length) {
            L.push('暂无数据');
        } else {
            var tc = 0;
            for (var d0 = 0; d0 &lt; dl.length; d0++) tc += dl[d0].calls;
            L.push('累计 ' + tc + ' 次 draw' +
                (fpTotalFrames > 0 ? ' · 约 ' + Math.round(tc / fpTotalFrames) + ' 次/帧' : ''));
            L.push('注: 一行 = 一个 GL program。同名多行是同一材质的不同 shader 变体');
            L.push('    (keyword 组合不同),不是重复计数 —— 变体多本身就是合批失败的信号。');
            // 同名变体标记 #1/#2:不标注的话并排两行数字相同,必然被误读成重复计数
            var nameSeen = {};
            for (var dn = 0; dn &lt; dl.length; dn++) {
                var nm0 = dl[dn].name;
                nameSeen[nm0] = (nameSeen[nm0] || 0) + 1;
            }
            var nameIdx = {};
            L.push(pad('程序', 34) + padL('次数', 8) + padL('占比', 7) + padL('每帧', 8) + padL('三角形', 11));
            var dtop = dl.slice(0, 25);
            for (var d1 = 0; d1 &lt; dtop.length; d1++) {
                var g0 = dtop[d1];
                var lbl = g0.name;
                if (nameSeen[g0.name] > 1) {
                    nameIdx[g0.name] = (nameIdx[g0.name] || 0) + 1;
                    lbl = g0.name + ' [变体' + nameIdx[g0.name] + '/' + nameSeen[g0.name] + ']';
                }
                L.push(pad(lbl, 34) + padL(String(g0.calls), 8) +
                    padL((tc > 0 ? Math.round(g0.calls / tc * 100) : 0) + '%', 7) +
                    padL(g0.frames > 0 ? (g0.calls / g0.frames).toFixed(1) : '-', 8) +
                    padL(g0.tris > 0 ? fmtBig(g0.tris) : '-', 11));
            }
            if (dl.length > dtop.length) L.push('… 共 ' + dl.length + ' 个,仅列前 ' + dtop.length);

            // 三角形单独排序:上表按 CPU 提交时间排,GPU 侧的账完全没记 ——
            // 三角形数暴涨的材质在低端机上可能是真瓶颈,却排在上表末尾。
            var byTris = dl.slice(0).sort(function (a, b) { return b.tris - a.tris; });
            var hasTris = byTris.length > 0 &amp;&amp; byTris[0].tris > 0;
            if (hasTris) {
                L.push('');
                L.push('· 按三角形数排序(前 8) —— GPU 侧无计时,这里是唯一的 GPU 负载线索');
                var ttop = byTris.slice(0, 8);
                for (var t1 = 0; t1 &lt; ttop.length; t1++) {
                    var g1 = ttop[t1];
                    if (g1.tris &lt;= 0) break;
                    var perFrame = g1.frames > 0 ? (g1.tris / g1.frames) : 0;
                    var flag = perFrame > 1000000 ? '  ⚠ 每帧超百万' : '';
                    L.push(pad(g1.name, 34) + padL(fmtBig(g1.tris), 11) +
                        padL(perFrame > 0 ? fmtBig(perFrame) + '/帧' : '-', 13) + flag);
                }
            }
        }
        L.push('');
        L.push('--- 卡顿(阈值 ' + hitchMs + 'ms) ---');
        if (!fpHooked) {
            L.push('⚠ 未挂上引擎帧事件,无卡顿数据');
        } else {
            var dr = fpTotalFrames > 0 ? (hitchCount1 / fpTotalFrames * 100) : 0;
            L.push('掉帧率 ' + dr.toFixed(1) + '%  (' + hitchCount1 + '/' + fpTotalFrames + ' 帧)  ·  严重(>100ms) ' +
                hitchCount2 + ' 次  ·  最长 ' + fmtMsFine(hitchWorst));
            if (shaderRuntimeCount > 0) {
                L.push('⚠ 运行期 shader 编译 ' + shaderRuntimeCount + ' 次 / ' + fmtMsFine(shaderRuntimeMs) +
                    '  ← 游戏中途卡顿元凶,建议启动时预热');
            }
            if (heapMB() > 0) {
                L.push('GC ' + gcEvents.length + ' 次  ·  每帧分配 ' +
                    (allocPerFrame > 0 ? allocPerFrame.toFixed(3) + 'MB' : '~0') +
                    '  ·  当前堆 ' + heapMB().toFixed(1) + 'MB');
            } else {
                // 不写这行,读者会把「没提内存」当成「内存没问题」
                L.push('GC/内存: ✗ 无法观测 —— ' + memNote().split('\n')[0]);
            }
            var hl = hitchList();
            if (hl.length) {
                L.push('');
                L.push(pad('耗时', 10) + pad('时刻', 10) + pad('update', 10) + pad('render', 10) + '特征');
                var htop = hl.slice(0, 20);
                for (var h1 = 0; h1 &lt; htop.length; h1++) {
                    var hh = htop[h1];
                    var tg = [];
                    if (hh.shaderN) tg.push('shader×' + hh.shaderN);
                    if (hh.dcDelta > 50) tg.push('DC+' + hh.dcDelta);
                    if (hh.fnN) tg.push('新函数×' + hh.fnN);
                    if (hh.heapDelta > 0.5) tg.push('+' + hh.heapDelta.toFixed(1) + 'MB');
                    L.push(pad(fmtMsFine(hh.ms), 10) + pad('@' + fmtMs(hh.at), 10) +
                        pad(fmtMsFine(hh.update), 10) + pad(fmtMsFine(hh.render), 10) +
                        (tg.length ? tg.join(' ') : '-'));
                    if (hh.fns &amp;&amp; hh.fns.length) L.push('    首次执行: ' + hh.fns.join(', '));
                }
                if (hl.length > htop.length) L.push('… 共 ' + hl.length + ' 条,仅列前 ' + htop.length);
            }
        }
        L.push('');
        L.push('--- 函数剖析(' + fnLevelName() + ',已插桩 ' + fnTypes + ' 类型/' + fnMethods + ' 方法) ---');
        if (!fnDefinePatched) {
            L.push('⚠ 未挂上 Bridge.define 钩子,无函数数据');
        } else {
            var list = fnList();
            L.push('自身/次 = 单次调用成本。它高 → 优化实现;它低但次数巨大 → 减少调用。');
            L.push(pad('函数', 46) + padL('次数', 8) + padL('自身', 9) + padL('自身/次', 9) + padL('含子', 9) + padL('最大', 8));
            var top = list.slice(0, 40);
            for (var j = 0; j &lt; top.length; j++) {
                var f = top[j];
                var per = (f.n > 0 &amp;&amp; f.self > 0) ? (f.self / f.n) : 0;
                L.push(pad(f.name, 46) + padL(String(f.n), 8) +
                    padL(f.self > 0 ? fmtMsFine(f.self) : '-', 9) +
                    padL(per > 0 ? (per &lt; 0.01 ? per.toFixed(4) : per.toFixed(3)) : '-', 9) +
                    padL(f.incl > 0 ? fmtMsFine(f.incl) : '-', 9) +
                    padL(f.max > 0 ? fmtMsFine(f.max) : '-', 8));
            }
            if (list.length > top.length) L.push('… 共 ' + list.length + ' 个,仅列前 ' + top.length);

            // 单次昂贵榜:上表按总时间排,「偶发但单次很贵」的函数会被淹没,
            // 而它们正是偶发卡顿的元凶(均值低 → 趋势图上看不见)。
            var spiky = list.slice(0).filter(function (x) { return x.n >= 20 &amp;&amp; x.max >= 5; });
            spiky.sort(function (a, b) { return b.max - a.max; });
            if (spiky.length) {
                L.push('');
                L.push('· 单次尖峰榜(最大 ≥5ms 且调用 ≥20 次) —— 偶发卡顿嫌疑人');
                var stop = spiky.slice(0, 8);
                for (var s1 = 0; s1 &lt; stop.length; s1++) {
                    var sf = stop[s1];
                    var savg = sf.n > 0 ? (sf.self / sf.n) : 0;
                    L.push(pad(sf.name, 46) + padL('最大 ' + fmtMsFine(sf.max), 12) +
                        padL('均 ' + (savg &lt; 0.01 ? savg.toFixed(4) : savg.toFixed(3)) + 'ms', 14) +
                        padL('×' + sf.n, 9));
                }
            }
        }
        return L.join('\n');
    }

    function pad(s, n) {
        s = String(s);
        if (s.length >= n) return s.substring(0, n - 1) + ' ';
        while (s.length &lt; n) s += ' ';
        return s;
    }

    // 大数字压缩:2.98 亿三角形写成 298809279 没人读得出量级
    function fmtBig(v) {
        v = Math.round(v);
        if (v >= 100000000) return (v / 100000000).toFixed(2) + '亿';
        if (v >= 10000) return (v / 10000).toFixed(1) + '万';
        return String(v);
    }

    function padL(s, n) {
        s = String(s);
        while (s.length &lt; n) s = ' ' + s;
        return s;
    }

    // ===== 帧耗时拆分 =====

        // 表头

        frameStatsEl.appendChild(hd);

        var rows = [
            ['帧总计', fpSec.frame, fpPeak.frame, '#fff'],
            ['  update(脚本/动画)', fpSec.update, fpPeak.update, '#6bc46b'],
            ['  render(渲染提交)', fpSec.render, fpPeak.render, '#4a9eff'],
            ['  物理', fpPhysSec, 0, '#b98cff'],
            ['  其他(输入/UI/杂项)', fpSec.other, 0, '#9aa4b1']
        ];
        for (var i = 0; i &lt; rows.length; i++) {
            var nm = rows[i][0], v = rows[i][1], pk = rows[i][2], col = rows[i][3];

            c1.textContent = (isPhys &amp;&amp; !fpPhysHooked) ? '-' : fmtMsFine(v);
            var c2 = makeEl('div', { width: '46px', flex: 'none', textAlign: 'right', color: '#9aa4b1' });
            c2.textContent = (i === 0) ? '100%'
                : ((isPhys &amp;&amp; !fpPhysHooked) ? '-'
                    : (fpSec.frame > 0 ? Math.round(v / fpSec.frame * 100) + '%' : '-'));
            var c3 = makeEl('div', { width: '56px', flex: 'none', textAlign: 'right', color: '#ff6b6b' });
            c3.textContent = pk > 0 ? fmtMsFine(pk) : '-';
            row.appendChild(c0); row.appendChild(c1); row.appendChild(c2); row.appendChild(c3);

        var miniBtn = {

        lab.textContent = '阈值';
        row.appendChild(lab);
        [5, 10, 16, 33, 50, 100].forEach(function (v) {
            var b = makeEl('button', miniBtn);
            b.textContent = v + 'ms';
            if (hitchMs === v) { b.style.background = 'rgba(255,107,107,0.35)'; b.style.color = '#fff'; }

        });
        var rst = makeEl('button', miniBtn);
        rst.textContent = '清零';
        rst.addEventListener('click', function () {
            hitches = []; hitchCount1 = 0; hitchCount2 = 0; hitchWorst = 0;
            gcEvents = []; taskAttrib = []; renderHitchView();
        });
        row.appendChild(rst);
        hitchCtrlEl.appendChild(row);

        // 掉帧率/分级统计:比&quot;平均 FPS&quot;有用得多 —— 平均 52 可能是稳定 52,

        var dropPct = fpTotalFrames > 0 ? (hitchCount1 / fpTotalFrames * 100) : 0;
        var s1 = makeEl('div', { fontSize: '10px', color: '#fff', padding: '2px 8px', whiteSpace: 'pre-wrap' });
        s1.textContent = '掉帧率 ' + dropPct.toFixed(1) + '%  (' + hitchCount1 + ' / ' + fpTotalFrames + ' 帧)\n' +
            '轻微(>' + hitchMs + 'ms) ' + hitchCount1 + ' 次  ·  严重(>100ms) ' + hitchCount2 + ' 次  ·  最长 ' + fmtMsFine(hitchWorst);
        hitchCtrlEl.appendChild(s1);

        // 运行时 shader 编译告警(游戏中途卡顿的头号元凶)
        if (shaderRuntimeCount > 0) {
            var warn = makeEl('div', { fontSize: '10px', color: '#ff6b6b', padding: '3px 8px', whiteSpace: 'pre-wrap', background: 'rgba(255,107,107,0.10)' });
            var wt = '⚠ 运行期 shader 编译 ' + shaderRuntimeCount + ' 次 / ' + fmtMsFine(shaderRuntimeMs) + '\n' +
                '引擎首次用到某材质才链接 shader,会在游戏中途同步阻塞主线程。\n' +
                '解法:启动时预热(提前渲染一次该材质)或用 shader 变体集合预编译。';
            if (shaderRuntimeEvents.length) {
                wt += '\n最慢: ';
                for (var w = 0; w &lt; Math.min(3, shaderRuntimeEvents.length); w++) {
                    wt += shaderRuntimeEvents[w].kind + ' ' + fmtMsFine(shaderRuntimeEvents[w].ms) +
                        ' @' + fmtMs(shaderRuntimeEvents[w].at) + '  ';
                }
            }

            hitchCtrlEl.appendChild(warn);
        }

        // GC / 分配速率
        var gcLine = makeEl('div', { fontSize: '9px', color: '#9aa4b1', padding: '2px 8px', whiteSpace: 'pre-wrap' });
        if (heapMB() > 0) {

            if (gcEvents.length) {
                var gsum = 0;
                for (var g = 0; g &lt; gcEvents.length; g++) gsum += gcEvents[g].drop;

            }
            gtxt += '\n每帧分配 ' + (allocPerFrame > 0 ? allocPerFrame.toFixed(3) + 'MB' : '~0') +

        // 能力状态:必须让用户能区分&quot;没阻塞&quot;和&quot;没在测&quot;

            var open = !!hitchOpen[key];
            var hr = makeEl('div', {
                display: 'flex', alignItems: 'center', fontSize: '10px', padding: '3px 8px',
                borderBottom: '1px solid rgba(255,255,255,0.08)'

            c0.textContent = (open ? '▾ ' : '▸ ') + fmtMsFine(h.ms);
            var c1 = makeEl('div', { flex: '1', color: '#9aa4b1', overflow: 'hidden', whiteSpace: 'nowrap' });
            var tag = [];
            if (h.shaderN) tag.push('shader×' + h.shaderN);
            if (h.dcDelta > 50) tag.push('DC+' + h.dcDelta);
            if (h.fnN) tag.push('新函数×' + h.fnN);
            if (h.heapDelta > 0.5) tag.push('+' + h.heapDelta.toFixed(1) + 'MB');
            c1.textContent = tag.length ? tag.join('  ') : '无明显特征';
            var c2 = makeEl('div', { width: '54px', flex: 'none', textAlign: 'right', color: '#c8c8c8' });
            c2.textContent = '@' + fmtMs(h.at);
            hr.appendChild(c0); hr.appendChild(c1); hr.appendChild(c2);
            (function (k) {

            hitchListEl.appendChild(hr);

            if (open) {

                var dt = 'update ' + fmtMsFine(h.update) + '  ·  render ' + fmtMsFine(h.render) +
                    '  ·  其他 ' + fmtMsFine(h.other);
                if (fpPhysHooked) dt += '  ·  物理 ' + fmtMsFine(h.physics);
                dt += '\nDrawCall ' + h.dc + (h.dcDelta !== 0 ? ('  (前一帧 ' + (h.dc - h.dcDelta) + ', ' + (h.dcDelta > 0 ? '↑' : '↓') + Math.abs(h.dcDelta) + ')') : '');
                if (h.heapDelta !== 0) dt += '\nJS 堆 ' + (h.heapDelta > 0 ? '+' : '') + h.heapDelta.toFixed(2) + 'MB';
                det.textContent = dt;
                box.appendChild(det);
                if (h.shaders &amp;&amp; h.shaders.length) {
                    var sh = makeEl('div', { fontSize: '9px', color: '#ff6b6b', padding: '1px 8px 1px 20px', whiteSpace: 'pre-wrap' });
                    sh.textContent = '本帧 shader 编译: ' + h.shaders.join(', ') +
                        (h.shaderN > h.shaders.length ? ' …共 ' + h.shaderN : '');
                    box.appendChild(sh);
                }
                if (h.fns &amp;&amp; h.fns.length) {
                    var fnl = makeEl('div', { fontSize: '9px', color: '#6bc46b', padding: '1px 8px 1px 20px', whiteSpace: 'pre-wrap' });

                }
                // 本帧函数耗时 Top 10(按自身耗时排序,这才是找卡顿元凶的关键)

                    if (h.render > h.update) ht += '\nrender 占比高 → 可能是 GPU 侧(overdraw/填充率/纹理带宽),JS 观测不到。';
                    else ht += '\nupdate 占比高 → 去【函数】页签按「单次最大」排序找元凶。';
                    if (!fnDefinePatched) ht += '\n函数剖析未挂钩子,看不到代码级明细。';
                    else if (fnLevel === FN_OFF) ht += '\n函数剖析已关闭,开启后可看到本帧执行了什么。';

                    box.appendChild(hint);

        var note = makeEl('div', { fontSize: '9px', color: '#9aa4b1', padding: '3px 8px', whiteSpace: 'pre-wrap' });
        note.textContent = '按耗时降序,点行展开现场。缓冲满 ' + HITCH_MAX + ' 条后挤掉最轻的,保留最严重的。\n' +
            '⚠ GPU 时间无法测量:移动端浏览器普遍禁用 timer query 扩展。';
        hitchListEl.appendChild(note);

        // 长任务归因(浏览器原生)

    // ===== 复制 / 保存 =====
    function fallbackCopy(t) {
        try {
            var ta = document.createElement('textarea');
            ta.value = t;
            ta.style.cssText = 'position:fixed;left:-9999px;opacity:0;';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            return true;
        } catch (e) { return false; }
    }

    function copyText(t) {
        if (!t) { toast('未选中日志'); return; }
        if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText) {
            navigator.clipboard.writeText(t).then(function () {
                toast('已复制');
            }, function () {
                toast(fallbackCopy(t) ? '已复制' : '复制失败');
            });
        } else {
            toast(fallbackCopy(t) ? '已复制' : '复制失败');
        }
    }

    function saveLogs() {
        try {
            var lines = [];
            for (var i = 0; i &lt; ringCount; i++) {
                var e = ringAt(i);
                lines.push('[' + e.time + '] [' + e.level + '] ' + e.text);
                if (e.stack) lines.push(e.stack);
            }
            var blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'logs_' + nowStamp().replace(/[:.]/g, '') + '.txt';
            document.body.appendChild(a);
            a.click();
            setTimeout(function () {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 500);
            toast('已保存 ' + ringCount + ' 条日志');
        } catch (e) {
            toast('保存失败: ' + (e &amp;&amp; e.message || e));
        }
    }

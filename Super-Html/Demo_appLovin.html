// 事件名称映射
const EVENT_NAME_MAP = {
	InitPlayable: "LOADING",
	Loaded: "LOADED",
	Display: "DISPLAYED",
	ShowEndCard: "ENDCARD_SHOWN",
	Retry: "CHALLENGE_RETRY",
	Install: "CTA_CLICKED",
	Completed: "COMPLETED",
};

// 挑战进度映射
const CHALLENGE_MAP = {
	0: "CHALLENGE_STARTED",
	25: "CHALLENGE_PASS_25",
	50: "CHALLENGE_PASS_50",
	75: "CHALLENGE_PASS_75",
	100: "CHALLENGE_SOLVED",
	[-1]: "CHALLENGE_FAILED",
};

// 事件枚举
const PlayableEvent = {
	InitPlayable: 0,
	Loaded: 1,
	Display: 2,
	ShowEndCard: 3,
	Retry: 4,
	Install: 5,
	Completed: 6,
};

// 数字枚举→事件名键的映射
const EVENT_NUM_TO_KEY_MAP = {
	0: "InitPlayable",
	1: "Loaded",
	2: "Display",
	3: "ShowEndCard",
	4: "Retry",
	5: "Install",
	6: "Completed",
};

// 基础追踪类
class PlayableAnalyticsBase {
	constructor(development) {
		this.development = development;
		this.reportedProgressList = new Set();
		this._lastDispatchAt = 0;
		this._lastDispatchName = "";
	}

	_dispatchSequential(eventKey) {
		const TOO_FAST_THRESHOLD_MS = 3;
		const DELAY_MS = 8;
		const now = Date.now();
		const gap = now - this._lastDispatchAt;
		const name = this.getEventName(eventKey);
		if (this._lastDispatchAt && gap < TOO_FAST_THRESHOLD_MS) {
			this._lastDispatchAt = now + DELAY_MS;
			this._lastDispatchName = name;
			setTimeout(() => this.trackCustomEvent(eventKey), DELAY_MS);
		} else {
			this._lastDispatchAt = now;
			this._lastDispatchName = name;
			this.trackCustomEvent(eventKey);
		}
	}

	onInitPlayable() { this._dispatchSequential(PlayableEvent.InitPlayable); }
	onLoaded() { this._dispatchSequential(PlayableEvent.Loaded); }
	onDisplay() { this._dispatchSequential(PlayableEvent.Display); }
	onShowEnding() { this.trackCustomEvent(PlayableEvent.ShowEndCard); }
	onShowEndCard() { this.trackCustomEvent(PlayableEvent.ShowEndCard); }
	onRetry() { this.trackCustomEvent(PlayableEvent.Retry); }
	onInstall(installType) { this.trackCustomEvent(PlayableEvent.Install, { installType }); }
	onCompleted() { this.trackCustomEvent(PlayableEvent.Completed); }
	onChallengeProgress(progress) { this.trackCustomEvent(null, { progress }); }
	onCustomChallengeProgress(progress) { this.trackCustomEvent(null, { customProgress: progress }); }
	onCustomEvent(eventName, value) { this.trackCustomEvent(null, { customEventName: eventName, customEventValue: value }); }

	getEventName(event) {
		const eventKey = typeof event === "number" ? EVENT_NUM_TO_KEY_MAP[event] : event;
		return this.eventNameMap?.[eventKey] || event;
	}

	trackCustomEvent(event, data) {
		try {
			this.sendTrackEvent(this.getEventName(event) ?? event, data);
		} catch (err) {}
	}
}

// 实际使用的追踪类
class ALPlayableAnalytics extends PlayableAnalyticsBase {
	constructor(development) {
		super(development);
		this.eventNameMap = EVENT_NAME_MAP;
		this.reverseEventNameMap = Object.fromEntries(Object.entries(EVENT_NAME_MAP).map(([k, v]) => [v, k]));
		console.log("%c 🚀 playcools %c 打点已启用 ", "background:#1a1a2e;color:#e94560;padding:2px 6px;border-radius:3px 0 0 3px;font-weight:bold;", "background:#e94560;color:#fff;padding:2px 10px;border-radius:0 3px 3px 0;");
	}

	_log(eventName, suffix) {
		const label = "事件名：" + eventName + (suffix ? " " + suffix : "");
		console.log(
			"%c [Playable打点] %c " + label + " ",
			"background: #2d3748; color: #ffffff; padding: 2px 6px; border-radius: 3px 0 0 3px; font-weight: bold;",
			"background: #4299e1; color: #ffffff; padding: 2px 10px; border-radius: 0 3px 3px 0;",
		);
	}

	sendTrackEvent(event, data) {
		if (data?.customProgress !== undefined) {
			const customProgress = data.customProgress;
			const finalEventName = customProgress === -1 ? "CHALLENGE_FAILED" : "CHALLENGE_PASS_" + customProgress;
			const dedupKey = "custom_progress_" + customProgress;
			if (this.reportedProgressList.has(dedupKey)) return;
			this.reportedProgressList.add(dedupKey);
			this._log(finalEventName, "(自定义进度: " + customProgress + ")");
			if (typeof window.ALPlayableAnalytics !== "undefined") window.ALPlayableAnalytics.trackEvent(finalEventName);
			return;
		}

		if (data?.customEventName !== undefined) {
			const finalEventName = data.customEventName;
			const customEventValue = data.customEventValue;
			if (!finalEventName) return;
			this._log(finalEventName, customEventValue !== undefined ? "值：" + customEventValue : "");
			if (typeof window.ALPlayableAnalytics !== "undefined") window.ALPlayableAnalytics.trackEvent(finalEventName, customEventValue);
			return;
		}

		const progress = data?.progress;
		if (!event && progress === undefined) return;

		let finalEventName = event;
		let suffix = "";

		if (progress !== undefined) {
			if (!Object.keys(CHALLENGE_MAP).includes(String(progress))) return;
			if (this.reportedProgressList.has(progress)) return;
			this.reportedProgressList.add(progress);
			finalEventName = CHALLENGE_MAP[progress];
			if (progress !== -1) suffix = "（进度: " + progress + "）";
		} else if (event && !this.reverseEventNameMap[event]) {
			return;
		}

		if (!finalEventName) return;

		this._log(finalEventName, suffix);
		if (typeof window.ALPlayableAnalytics !== "undefined") {
			window.ALPlayableAnalytics.trackEvent(finalEventName);
		}
	}
}

window.createPlayableAnalytics = (config) => new ALPlayableAnalytics(config.development);
